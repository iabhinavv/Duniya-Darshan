/* ===== 06-charts.js ===== */
/* 06-charts — small inline-SVG charts. No library, no canvas. */
'use strict';

(function () {
  var NS = 'http://www.w3.org/2000/svg';
  function s(tag, attrs) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    return n;
  }

  /* Inks that sit properly on newsprint — muted, not screen-bright. */
  /* Everything is navy, blue or magenta — the five-colour palette, no strays. */
  var CAT_COLOURS = {
    flights: '#00254a', transport: '#75a7f1', lodging: '#db0b69', food: '#0b529b',
    activities: '#a9c8f7', carRental: '#f4569b', visa: '#003a75', misc: '#667c92',
    railway: '#00254a', intercity: '#75a7f1', petrol: '#f4569b'
  };
  var FALLBACK = ['#00254a', '#75a7f1', '#db0b69', '#0b529b', '#a9c8f7', '#f4569b',
                  '#003a75', '#667c92', '#4b83c9', '#8f1247', '#c8dcf9', '#ff8fbb'];

  function colourFor(id, i) { return CAT_COLOURS[id] || FALLBACK[i % FALLBACK.length]; }

  /* Merging two trips puts Flights beside Flights & Rail, and Transportation
     beside Intercity Travel — pairs that share a colour, so the chart reads as
     one navy mass. Hand out the preferred colour first, then the next unused
     one, so every slice in a combined chart is told apart. */
  function distinctColours(ids) {
    var taken = {}, out = {};
    ids.forEach(function (id) {
      var want = CAT_COLOURS[id];
      if (want && !taken[want]) { taken[want] = 1; out[id] = want; }
    });
    ids.forEach(function (id) {
      if (out[id]) return;
      for (var i = 0; i < FALLBACK.length; i++) {
        if (!taken[FALLBACK[i]]) { taken[FALLBACK[i]] = 1; out[id] = FALLBACK[i]; return; }
      }
      out[id] = CAT_COLOURS[id] || FALLBACK[0];
    });
    return out;
  }

  /* Donut with a centred label. Hovering a slice — or its legend row — swaps the
     centre for that slice's own figure and lifts it out of the ring.
     data = [{id, label, value, colour}] */
  function donut(data, opts) {
    var o = opts || {};
    var size = o.size || 168, thick = o.thick || 26, r = (size - thick) / 2, c = size / 2;
    var total = DD.sum(data, function (d) { return d.value; });
    var svg = s('svg', { viewBox: '0 0 ' + size + ' ' + size, width: size, height: size,
      role: 'img', class: 'donut' });
    svg.setAttribute('aria-label', o.aria || 'Breakdown');

    svg.appendChild(s('circle', { cx: c, cy: c, r: r, fill: 'none', stroke: '#d8e7fb', 'stroke-width': thick }));

    var t1 = s('text', { x: c, y: c - 2, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 800, fill: '#00254a' });
    var t2 = s('text', { x: c, y: c + 16, 'text-anchor': 'middle', 'font-size': 10.5, fill: '#667c92' });
    var t3 = s('text', { x: c, y: c + 30, 'text-anchor': 'middle', 'font-size': 10.5, fill: '#667c92' });

    function rest() {
      t1.textContent = o.centre || DD.money(total, { compact: true });
      t1.setAttribute('fill', '#00254a');
      t2.textContent = o.centreSub || '';
      t3.textContent = '';
    }

    var arcs = [];
    if (total > 0) {
      var circ = 2 * Math.PI * r, offset = 0;
      data.forEach(function (d, i) {
        if (d.value <= 0) return;
        var frac = d.value / total;
        var colour = d.colour || colourFor(d.id, i);
        /* A slice under about 0.4% made (circ * frac - 1.5) negative. An invalid
           dash array is treated as "none", so that arc drew a full circle over
           the whole chart and the donut came out one flat colour. */
        var seg = Math.max(0.8, circ * frac - 1.5);
        var arc = s('circle', {
          cx: c, cy: c, r: r, fill: 'none', class: 'donut-arc',
          stroke: colour, 'stroke-width': thick,
          'stroke-dasharray': seg.toFixed(2) + ' ' + Math.max(0, circ - seg).toFixed(2),
          'stroke-dashoffset': -circ * offset,
          transform: 'rotate(-90 ' + c + ' ' + c + ')'
        });
        arc.appendChild(s('title', {})).textContent = d.label + ' — ' + DD.money(d.value);
        arc.addEventListener('mouseenter', function () { focus(d, colour); });
        arc.addEventListener('mouseleave', blur);
        svg.appendChild(arc);
        arcs.push({ node: arc, d: d, colour: colour, thick: thick });
        offset += frac;
      });
    }

    function focus(d, colour) {
      arcs.forEach(function (a) {
        var on = a.d === d;
        a.node.setAttribute('stroke-width', on ? thick + 7 : thick);
        a.node.style.opacity = on ? '1' : '.35';
      });
      t1.textContent = DD.money(d.value, { compact: true });
      t1.setAttribute('fill', colour);
      t2.textContent = d.label;
      t3.textContent = DD.pct(d.value, total) + '% of ' + DD.money(total, { compact: true });
    }

    function blur() {
      arcs.forEach(function (a) {
        a.node.setAttribute('stroke-width', thick);
        a.node.style.opacity = '1';
      });
      rest();
    }

    svg.appendChild(t1);
    svg.appendChild(t2);
    svg.appendChild(t3);
    rest();

    /* Let a legend drive the same highlight. */
    svg.ddFocus = function (id) {
      var hit = arcs.filter(function (a) { return a.d.id === id; })[0];
      if (hit) focus(hit.d, hit.colour); else blur();
    };
    svg.ddBlur = blur;
    return svg;
  }

  function legend(data, linked) {
    var wrap = DD.el('div', { style: { display: 'flex', flexDirection: 'column', gap: '7px', minWidth: '0' } });
    var total = DD.sum(data, function (d) { return d.value; });
    data.forEach(function (d, i) {
      if (d.value <= 0) return;
      wrap.appendChild(DD.el('div', {
        class: 'legend-row',
        onmouseenter: function () { if (linked && linked.ddFocus) linked.ddFocus(d.id); },
        onmouseleave: function () { if (linked && linked.ddBlur) linked.ddBlur(); },
        style: { display: 'flex', alignItems: 'center', gap: '8px', fontSize: '13px' } }, [
        DD.el('span', { class: 'dot', style: { background: d.colour || colourFor(d.id, i) } }),
        DD.el('span', { style: { flex: '1', minWidth: '0', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }, text: d.label }),
        DD.el('span', { class: 'num muted tiny', text: DD.pct(d.value, total) + '%' }),
        DD.el('span', { class: 'num', style: { fontWeight: '600', minWidth: '74px', textAlign: 'right' }, text: DD.money(d.value, { compact: true }) })
      ]));
    });
    if (!wrap.children.length) wrap.appendChild(DD.el('div', { class: 'muted small', text: 'Nothing logged yet.' }));
    return wrap;
  }

  /* Two-series step line: cumulative budget vs cumulative actual across places. */
  function runningLine(points, opts) {
    var o = opts || {};
    var w = o.width || 640, h = o.height || 190, padL = 8, padR = 8, padT = 12, padB = 26;
    var svg = s('svg', { viewBox: '0 0 ' + w + ' ' + h, width: '100%', height: h, preserveAspectRatio: 'none', role: 'img' });
    svg.setAttribute('aria-label', o.aria || 'Running total');
    if (!points.length) return svg;

    var maxY = 0;
    points.forEach(function (p) { maxY = Math.max(maxY, p.budget, p.actual); });
    if (maxY <= 0) maxY = 1;
    var iw = w - padL - padR, ih = h - padT - padB;
    var xs = function (i) { return padL + (points.length === 1 ? iw / 2 : (i / (points.length - 1)) * iw); };
    var ys = function (v) { return padT + ih - (v / maxY) * ih; };

    [0.25, 0.5, 0.75, 1].forEach(function (f) {
      svg.appendChild(s('line', { x1: padL, x2: w - padR, y1: ys(maxY * f), y2: ys(maxY * f), stroke: '#d8e7fb', 'stroke-width': 1 }));
    });

    function path(key) {
      return points.map(function (p, i) { return (i ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(p[key]).toFixed(1); }).join(' ');
    }

    var area = path('budget') + ' L' + xs(points.length - 1) + ' ' + ys(0) + ' L' + xs(0) + ' ' + ys(0) + ' Z';
    svg.appendChild(s('path', { d: area, fill: 'rgba(117,167,241,.18)', stroke: 'none' }));
    svg.appendChild(s('path', { d: path('budget'), fill: 'none', stroke: '#00254a', 'stroke-width': 2, 'stroke-linejoin': 'round', 'vector-effect': 'non-scaling-stroke' }));
    svg.appendChild(s('path', { d: path('actual'), fill: 'none', stroke: '#db0b69', 'stroke-width': 2, 'stroke-dasharray': '4 3', 'stroke-linejoin': 'round', 'vector-effect': 'non-scaling-stroke' }));

    points.forEach(function (p, i) {
      var g = s('circle', { cx: xs(i), cy: ys(p.budget), r: 2.6, fill: '#00254a' });
      var ttl = s('title', {});
      ttl.textContent = p.label + ' — budget ' + DD.money(p.budget) + ', actual ' + DD.money(p.actual);
      g.appendChild(ttl);
      svg.appendChild(g);
    });
    return svg;
  }

  /* Horizontal budget-vs-actual bars, one row per item. */
  function compareBars(rows, opts) {
    var o = opts || {};
    var wrap = DD.el('div', { style: { display: 'flex', flexDirection: 'column', gap: '11px' } });
    var max = 0;
    rows.forEach(function (r) { max = Math.max(max, r.budget, r.actual); });
    if (max <= 0) max = 1;
    rows.forEach(function (r) {
      var over = r.actual > r.budget && r.budget > 0;
      wrap.appendChild(DD.el('div', {}, [
        DD.el('div', { style: { display: 'flex', gap: '8px', alignItems: 'baseline', marginBottom: '4px' } }, [
          DD.el('span', { style: { fontSize: '13.5px', fontWeight: '550', flex: '1', minWidth: '0', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }, text: r.label }),
          DD.el('span', { class: 'num tiny', style: { color: over ? 'var(--red)' : 'var(--ink-3)' }, text: DD.money(r.actual, { compact: true }) + ' / ' + DD.money(r.budget, { compact: true }) })
        ]),
        DD.el('div', { style: { position: 'relative', height: '15px' } }, [
          DD.el('div', { style: { position: 'absolute', inset: '4px 0', background: '#e3edfc', borderRadius: '2px' } }),
          DD.el('div', { style: { position: 'absolute', top: '4px', bottom: '4px', left: '0', width: (r.budget / max * 100) + '%', background: 'var(--brand-100)', borderRadius: '2px' } }),
          DD.el('div', { style: { position: 'absolute', top: '1px', bottom: '1px', left: '0', width: (Math.min(r.actual, max) / max * 100) + '%', background: over ? 'var(--pink)' : 'linear-gradient(90deg,var(--brand-800),var(--brand-500))', borderRadius: '2px' } })
        ])
      ]));
    });
    if (!rows.length) wrap.appendChild(DD.el('div', { class: 'muted small', text: o.empty || 'Nothing to compare yet.' }));
    return wrap;
  }

  /* Vertical budget-vs-actual bars, with a rupee scale down the left and the
     figures on hover. rows = [{id, label, budget, actual}] */
  function verticalCompareBars(rows, opts) {
    var o = opts || {};
    var H = o.height || 210;

    var wrap = DD.el('div', { class: 'vbars' });
    if (!rows.length) {
      wrap.appendChild(DD.el('div', { class: 'muted small', text: o.empty || 'Nothing to compare yet.' }));
      return wrap;
    }

    var max = 0;
    rows.forEach(function (r) { max = Math.max(max, r.budget, r.actual); });
    if (max <= 0) max = 1;
    max = niceTop(max);

    var colours = o.colours || {};
    var tip = DD.el('div', { class: 'vbars-tip' });

    /* the rupee scale */
    var axis = DD.el('div', { class: 'vbars-axis', style: { height: H + 'px' } });
    var ticks = [1, 0.75, 0.5, 0.25, 0];
    ticks.forEach(function (f) {
      axis.appendChild(DD.el('span', { class: 'vbars-tick', text: f ? DD.money(max * f, { compact: true }) : '₹0' }));
    });

    var plot = DD.el('div', { class: 'vbars-plot', style: { height: H + 'px' } });
    ticks.forEach(function (f) {
      plot.appendChild(DD.el('i', { class: 'vbars-grid' + (f ? '' : ' base'), style: { bottom: (f * 100) + '%' } }));
    });

    var lane = DD.el('div', { class: 'vbars-lane' });
    rows.forEach(function (r, i) {
      var colour = colours[r.id] || (r.id ? colourFor(r.id, i) : '#00254a');
      var over = r.actual > r.budget && r.budget > 0;

      var bBar = DD.el('i', { class: 'vb b',
        style: { height: pctOf(r.budget, max), background: colour, opacity: '.34' } });
      var aBar = DD.el('i', { class: 'vb a' + (over ? ' over' : ''),
        style: { height: pctOf(r.actual, max), background: over ? 'var(--pink)' : colour } });

      var col = DD.el('div', { class: 'vbars-col', tabindex: '0' }, [
        DD.el('div', { class: 'vbars-stack' }, [bBar, r.actual > 0 ? aBar : null]),
        DD.el('div', { class: 'vbars-name', title: r.label, text: r.label })
      ]);

      function show() {
        col.classList.add('on');
        DD.clear(tip);
        tip.appendChild(DD.el('b', { text: r.label }));
        tip.appendChild(DD.el('span', {}, ['Budget ', DD.el('b', { class: 'num', text: DD.money(r.budget) })]));
        if (r.actual > 0) {
          tip.appendChild(DD.el('span', {}, ['Spent ', DD.el('b', {
            class: 'num', style: { color: over ? 'var(--pink)' : 'var(--brand-500)' },
            text: DD.money(r.actual) })]));
          tip.appendChild(DD.el('span', { class: over ? 'over' : '' },
            (over ? DD.money(r.actual - r.budget) + ' over' : DD.money(r.budget - r.actual) + ' left')
            + ' · ' + DD.pct(r.actual, r.budget) + '% used'));
        } else {
          tip.appendChild(DD.el('span', { class: 'muted', text: 'nothing logged yet' }));
        }
        tip.classList.add('on');
        var pr = plot.getBoundingClientRect(), cr = col.getBoundingClientRect();
        tip.style.left = Math.round(cr.left - pr.left + cr.width / 2) + 'px';
      }
      function hide() { col.classList.remove('on'); tip.classList.remove('on'); }

      col.addEventListener('mouseenter', show);
      col.addEventListener('focus', show);
      col.addEventListener('mouseleave', hide);
      col.addEventListener('blur', hide);
      lane.appendChild(col);
    });

    plot.appendChild(lane);
    plot.appendChild(tip);
    wrap.appendChild(axis);
    wrap.appendChild(plot);
    return wrap;
  }

  function pctOf(v, max) { return Math.max(v > 0 ? 1.5 : 0, (v / max) * 100) + '%'; }

  /* Round the top of the scale up to something a person would draw. */
  function niceTop(v) {
    var mag = Math.pow(10, Math.floor(Math.log(v) / Math.LN10));
    var n = v / mag;
    var step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
    return step * mag;
  }

  DD.charts = { donut: donut, legend: legend, runningLine: runningLine, compareBars: compareBars,
    verticalCompareBars: verticalCompareBars, colourFor: colourFor, distinctColours: distinctColours };
})();


/* ===== 07-images.js ===== */
/* 07-images — free, credited photos from Wikipedia / Wikimedia Commons.
   No API key. Everything is optional: if the network is unavailable the app
   simply shows the gradient card and the paste-a-URL box. */
'use strict';

(function () {
  var WIKI = 'https://en.wikipedia.org/api/rest_v1/page/summary/';
  var COMMONS = 'https://commons.wikimedia.org/w/api.php';

  function online() { return navigator.onLine !== false; }

  /* Opened straight off the disk, the page has a null origin and Wikipedia's
     CORS headers do not apply. serve.py fixes that; until then, say so plainly. */
  function needsServer() { return location.protocol === 'file:'; }

  /* Adding a place fires one lookup; opening a 36-country trip would fire 36.
     Three at a time is polite to Wikimedia and keeps the UI responsive. */
  var queue = [], running = 0, LIMIT = 3;
  function enqueue(job) {
    return new Promise(function (resolve) {
      queue.push(function () {
        running++;
        job().then(resolve, resolve).then(function () {
          running--;
          pump();
        });
      });
      pump();
    });
  }
  function pump() {
    while (running < LIMIT && queue.length) queue.shift()();
  }

  function jsonp(url) {
    return fetch(url, { mode: 'cors', credentials: 'omit' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  /* One good lead image for a place, from its Wikipedia article. */
  function lead(query) {
    if (!online()) return Promise.reject(new Error('offline'));
    var title = encodeURIComponent(String(query).trim().replace(/\s+/g, '_'));
    return jsonp(WIKI + title + '?redirect=true').then(function (d) {
      var src = (d.originalimage && d.originalimage.source) || (d.thumbnail && d.thumbnail.source);
      if (!src) throw new Error('no image');
      if (d.thumbnail && d.thumbnail.source) src = d.thumbnail.source.replace(/\/\d+px-/, '/1024px-');
      return {
        url: src,
        credit: (d.titles && d.titles.normalized) || query,
        source: d.content_urls && d.content_urls.desktop ? d.content_urls.desktop.page : '',
        lat: d.coordinates ? d.coordinates.lat : null,
        lon: d.coordinates ? d.coordinates.lon : null
      };
    });
  }

  /* A handful more, searched on Commons. */
  function search(query, limit) {
    if (!online()) return Promise.resolve([]);
    var url = COMMONS + '?origin=*&action=query&format=json&generator=search'
      + '&gsrsearch=' + encodeURIComponent('filetype:bitmap ' + query)
      + '&gsrnamespace=6&gsrlimit=' + (limit || 8)
      + '&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=800';
    return jsonp(url).then(function (d) {
      var pages = d && d.query && d.query.pages;
      if (!pages) return [];
      return Object.keys(pages).map(function (k) {
        var p = pages[k], ii = p.imageinfo && p.imageinfo[0];
        if (!ii) return null;
        var meta = ii.extmetadata || {};
        var artist = meta.Artist && meta.Artist.value ? stripTags(meta.Artist.value) : '';
        var lic = meta.LicenseShortName && meta.LicenseShortName.value ? meta.LicenseShortName.value : '';
        return {
          url: ii.thumburl || ii.url,
          credit: [artist, lic].filter(Boolean).join(' · ') || 'Wikimedia Commons',
          source: ii.descriptionurl || ''
        };
      }).filter(Boolean);
    }).catch(function () { return []; });
  }

  function stripTags(html) {
    var d = document.createElement('div');
    d.innerHTML = html;
    return (d.textContent || '').trim().slice(0, 70);
  }

  /* The query that gets the best picture for a place. */
  function queryFor(place) {
    if (place.city && place.country && place.city !== place.country) return place.city;
    return place.city || place.country || place.name;
  }

  /* Fetch and store a lead image if the place has none. Resolves either way. */
  function ensureLead(place, onDone) {
    if (place.images && place.images.length) { onDone && onDone(false); return Promise.resolve(false); }
    if (place.noPhoto || !online() || needsServer()) { onDone && onDone(false); return Promise.resolve(false); }
    return enqueue(function () {
      return lead(queryFor(place)).then(function (img) {
        place.images = place.images || [];
        place.images.push({ url: img.url, credit: img.credit, source: img.source });
        if (typeof place.lat !== 'number' && typeof img.lat === 'number') {
          place.lat = img.lat;
          place.lon = img.lon;
        }
        DD.store.save();
        return true;
      }).catch(function () {
        /* Remember the miss so we do not ask again on every render. */
        place.noPhoto = true;
        return false;
      });
    }).then(function (got) { onDone && onDone(got); return got; });
  }

  /* --------------------------------------------------------- drive links */
  var DRIVE_FOLDER = /drive\.google\.com\/(?:drive\/(?:u\/\d+\/)?folders\/|open\?id=)([A-Za-z0-9_-]{10,})/;
  var DRIVE_FILE = /drive\.google\.com\/file\/d\/([A-Za-z0-9_-]{10,})/;

  function driveEmbed(url) {
    var m = DRIVE_FOLDER.exec(url || '');
    if (m) return 'https://drive.google.com/embeddedfolderview?id=' + m[1] + '#grid';
    m = DRIVE_FILE.exec(url || '');
    if (m) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
    return '';
  }

  function hostOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); }
    catch (e) { return url ? String(url).slice(0, 28) : ''; }
  }

  DD.images = {
    lead: lead, search: search, ensureLead: ensureLead, queryFor: queryFor,
    driveEmbed: driveEmbed, hostOf: hostOf, online: online, needsServer: needsServer
  };
})();


/* ===== 08-links.js ===== */
/* 08-links — booking deep links built from editable templates. */
'use strict';

(function () {
  var TOKENS = ['{city}', '{country}', '{iata}', '{home}', '{homecity}', '{in}', '{out}', '{yymmdd}', '{adults}', '{days}'];

  function build(kind, place, t) {
    t = t || DD.store.trip();
    var db = DD.store.db();
    var tpl = db.settings.linkTemplates[kind];
    if (!tpl || !tpl.url) return '';
    var sched = DD.store.schedule(t)[place.id] || {};
    var start = sched.start || t.start || '';
    var end = sched.end ? DD.addDays(sched.end, 1) : '';
    var map = {
      '{city}': place.city || place.country || place.name,
      '{country}': place.country || place.name,
      '{iata}': place.iata || '',
      '{home}': db.settings.homeAirport || '',
      '{homecity}': db.settings.homeCity || '',
      '{in}': start,
      '{out}': end,
      '{yymmdd}': start ? DD.yymmdd(start) : '',
      '{adults}': String(Math.max(1, Number(db.settings.adults) || 1)),
      '{days}': String(place.days || '')
    };
    var url = tpl.url;
    TOKENS.forEach(function (tok) {
      url = url.split(tok).join(encodeURIComponent(map[tok] === undefined ? '' : map[tok]));
    });
    return tidy(url);
  }

  /* A trip with no start date leaves date tokens empty. Rather than ship
     ".../DEL/JAI//?checkin=&checkout=" at the booking site, clear the gaps and
     let it default its own dates. */
  function tidy(url) {
    var parts = url.split('?');
    var path = parts[0].replace(/([^:])\/{2,}/g, '$1/');
    if (parts.length < 2) return path;
    var query = parts.slice(1).join('?').split('&')
      .filter(function (kv) { return kv && kv.slice(-1) !== '='; })
      .join('&');
    return query ? path + '?' + query : path;
  }

  function label(kind) {
    var tpl = DD.store.db().settings.linkTemplates[kind];
    return (tpl && tpl.label) || kind;
  }

  /* A place with no dates still gets a usable search URL — the site just
     defaults the dates itself, which is what you want while planning. */
  function openLink(kind, place) {
    var url = build(kind, place);
    if (!url) { DD.toast('No link template set for ' + kind, true); return; }
    window.open(url, '_blank', 'noopener');
  }

  DD.links = { build: build, label: label, open: openLink, TOKENS: TOKENS };
})();


/* ===== 09-map.js ===== */
/* 09-map — the world and India maps using OpenLayers and Esri Satellite imagery. */
'use strict';

(function () {
  var el = DD.el, S = DD.store;

  /* OpenLayers measures its container once, at construction. Inside a card that
     is still laying out — or a modal that is still opening — it latches on to
     the wrong width and paints tiles for only part of the viewport. Watch the
     element and re-measure whenever it changes shape. */
  function watchSize(map, wrap) {
    map.updateSize();
    if (window.ResizeObserver) {
      var ro = new ResizeObserver(function () { map.updateSize(); });
      ro.observe(wrap);
    }
    [120, 400, 1000].forEach(function (ms) {
      setTimeout(function () { map.updateSize(); }, ms);
    });
  }

  function keyFor(kind, place) {
    if (kind === 'world') return String(place.iso2 || '').toUpperCase();
    return place.city || place.name;
  }

  function entries(kind, trips) {
    var out = [];
    trips.forEach(function (t) {
      if (kind === 'world' && t.kind === 'domestic') return;
      if (kind === 'india' && t.kind !== 'domestic') return;
      t.places.forEach(function (p) {
        out.push({ trip: t, place: p, key: keyFor(kind, p), st: S.placeState(t, p) });
      });
    });
    return out;
  }

  function render(opts) {
    var kind = opts.kind || 'world';
    var list = entries(kind, opts.trips || [S.trip()]);

    var wrap = el('div', { class: 'mapwrap', style: { height: '500px', width: '100%', borderRadius: '6px', overflow: 'hidden', position: 'relative', zIndex: 1 } });

    setTimeout(function() {
      if (!wrap.isConnected) {
        var attempts = 0;
        var int = setInterval(function() {
          if (wrap.isConnected) {
            clearInterval(int);
            initOpenLayers(wrap, kind, list, opts);
          }
          if (++attempts > 50) clearInterval(int);
        }, 50);
      } else {
        initOpenLayers(wrap, kind, list, opts);
      }
    }, 0);

    return wrap;
  }

  function initOpenLayers(wrap, kind, list, opts) {
    if (!window.ol) return; // Ensure OpenLayers is loaded

    var features = [];
    
    list.forEach(function(e) {
      if (typeof e.place.lat === 'number' && typeof e.place.lon === 'number') {
        var markerColor = e.st.state === 'over' ? '#db0b69' : e.st.state === 'done' ? '#00163a' : '#75a7f1';
        
        var feature = new ol.Feature({
          geometry: new ol.geom.Point(ol.proj.fromLonLat([e.place.lon, e.place.lat])),
          data: e,
          markerColor: markerColor
        });
        
        features.push(feature);
      }
    });

    var vectorSource = new ol.source.Vector({ features: features });
    
    var map; // To be assigned below, captured in style function
    /* declutter drops any label that would collide with one already drawn, so
       the map thins itself out instead of stacking slips on top of each other. */
    var vectorLayer = new ol.layer.Vector({ 
      source: vectorSource, 
      zIndex: 2,
      declutter: true,
      style: function(feature, resolution) {
        var data = feature.get('data');
        var currentZoom = map ? map.getView().getZoomForResolution(resolution) : 2;
        /* Both maps open at a zoom where every label would fit at once, which is
           what made India unreadable. Hold them back until you have leaned in. */
        var nameFrom = kind === 'india' ? 6 : 4.2;
        var detailFrom = kind === 'india' ? 7.2 : 5.4;
        var showText = currentZoom >= nameFrom;
        var showDetail = currentZoom >= detailFrom;
        
        var markerColor = feature.get('markerColor');
        var pinSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="36" viewBox="0 0 24 36"><path fill="' + markerColor + '" stroke="#fff" stroke-width="2" d="M12,1 C5.925,1 1,5.925 1,12 C1,20.25 12,35 12,35 C12,35 23,20.25 23,12 C23,5.925 18.075,1 12,1 Z"/><circle cx="12" cy="12" r="4.5" fill="#fff"/></svg>';
        var pinSrc = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(pinSvg);

        var styles = [
          new ol.style.Style({
            image: new ol.style.Icon({
              src: pinSrc,
              anchor: [0.5, 1],
              scale: 0.9
            })
          })
        ];
        
        if (showText) {
          var label = data.place.name;
          if (showDetail) {
            label += '\n' + DD.plural(data.place.days, 'day')
              + '  \u00b7  ' + DD.money(data.st.budget, { compact: true });
            if (data.st.count) label += '\nspent ' + DD.money(data.st.spent, { compact: true });
          }

          styles.push(new ol.style.Style({
            text: new ol.style.Text({
              text: label,
              font: (showDetail ? '12px' : '13px') + ' "Yeseva One", serif',
              fill: new ol.style.Fill({ color: '#ffffff' }),
              backgroundFill: new ol.style.Fill({ color: 'rgba(0, 22, 58, 0.88)' }),
              backgroundStroke: new ol.style.Stroke({ color: '#ffffff', width: 1.2 }),
              padding: [5, 9, 5, 9],
              offsetY: -46,
              textAlign: 'center'
            })
          }));
        }
        return styles;
      }
    });
    
    var rasterLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        attributions: 'Tiles &copy; Esri',
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        maxZoom: 18
      }),
      zIndex: 1
    });

    var center = kind === 'india' ? ol.proj.fromLonLat([79.5, 22.5]) : ol.proj.fromLonLat([0, 20]);
    var zoom = kind === 'india' ? 4.5 : 2;

    map = new ol.Map({
      target: wrap,
      layers: [rasterLayer, vectorLayer],
      view: new ol.View({
        center: center,
        zoom: zoom,
        maxZoom: 18
      })
    });

    watchSize(map, wrap);

    if (features.length > 0) {
      var extent = vectorSource.getExtent();
      map.getView().fit(extent, { padding: [50, 50, 50, 50], maxZoom: 6, duration: 500 });
    }


    /* Hovering a pin used to repeat what the label already said. It now offers
       the two things you would actually want: open the place, or log a spend. */
    var popupElement = el('div', { class: 'map-pop' });

    var popupOverlay = new ol.Overlay({
      element: popupElement,
      positioning: 'bottom-center',
      stopEvent: true,
      offset: [0, -34]
    });
    map.addOverlay(popupOverlay);

    var hideTimer = null;
    var openFor = null;

    function showPop(data) {
      clearTimeout(hideTimer);
      if (openFor === data) { popupElement.style.display = 'block'; return; }
      openFor = data;

      var st = data.st;
      DD.clear(popupElement);
      popupElement.appendChild(el('b', { text: data.place.name }));
      popupElement.appendChild(el('span', {
        text: DD.plural(data.place.days, 'day') + '  ·  ' + DD.money(st.budget, { compact: true })
          + (st.count ? '  ·  ' + DD.money(st.spent, { compact: true }) + ' spent' : '')
      }));
      popupElement.appendChild(el('div', { class: 'map-pop-acts' }, [
        el('button', {
          class: 'btn xs pri',
          onclick: function (ev) {
            ev.stopPropagation();
            hidePop();
            if (opts.onPick) opts.onPick(data);
          }
        }, 'Open'),
        el('button', {
          class: 'btn xs',
          onclick: function (ev) {
            ev.stopPropagation();
            hidePop();
            DD.logForm({ trip: data.trip, placeId: data.place.id });
          }
        }, [DD.icon('plus', 12), 'Log'])
      ]));

      var pt = data.__coord || null;
      if (pt) popupOverlay.setPosition(pt);
      popupElement.style.display = 'block';
    }

    function hidePop() {
      popupElement.style.display = 'none';
      openFor = null;
    }
    function scheduleHide() {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(hidePop, 280);
    }

    popupElement.addEventListener('mouseenter', function () { clearTimeout(hideTimer); });
    popupElement.addEventListener('mouseleave', scheduleHide);

    function featureAt(pixel) {
      return map.forEachFeatureAtPixel(pixel, function (f) { return f; }, { hitTolerance: 6 });
    }

    map.on('pointermove', function (evt) {
      if (evt.dragging) { hidePop(); return; }
      var feature = featureAt(evt.pixel);
      if (feature) {
        map.getTargetElement().style.cursor = 'pointer';
        var data = feature.get('data');
        data.__coord = feature.getGeometry().getCoordinates();
        showPop(data);
      } else {
        map.getTargetElement().style.cursor = '';
        scheduleHide();
      }
    });

    /* A tap does the same thing, so touch gets the buttons too. */
    map.on('click', function (evt) {
      var feature = featureAt(evt.pixel);
      if (!feature) { hidePop(); return; }
      var data = feature.get('data');
      data.__coord = feature.getGeometry().getCoordinates();
      showPop(data);
    });
  }

  /* ------------------------------------------------------------ road map
     A street map of one place, for the panel inside a country or state. Roads
     rather than satellite, because this is the one you read to get about. */
  function road(place, opts) {
    opts = opts || {};
    var wrap = el('div', {
      class: 'roadmap',
      style: { height: (opts.height || 320) + 'px', width: '100%', position: 'relative' }
    });

    var lat = typeof place.lat === 'number' ? place.lat : null;
    var lon = typeof place.lon === 'number' ? place.lon : null;
    if (lat === null || lon === null || !window.ol) return wrap;

    /* The panel is built before it is in the document, and OpenLayers needs a
       laid-out element to size itself against. Wait for it to land. */
    var tries = 0;
    var timer = setInterval(function () {
      if (wrap.isConnected && wrap.clientWidth) { clearInterval(timer); build(); }
      else if (++tries > 60) clearInterval(timer);
    }, 50);

    function build() {
      var centre = ol.proj.fromLonLat([lon, lat]);
      var pin = '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="38" viewBox="0 0 24 36">'
        + '<path fill="#db0b69" stroke="#fff" stroke-width="2" d="M12,1 C5.925,1 1,5.925 1,12 C1,20.25 12,35 12,35 C12,35 23,20.25 23,12 C23,5.925 18.075,1 12,1 Z"/>'
        + '<circle cx="12" cy="12" r="4.5" fill="#fff"/></svg>';

      var marker = new ol.Feature({ geometry: new ol.geom.Point(centre) });
      marker.setStyle(new ol.style.Style({
        image: new ol.style.Icon({
          src: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(pin),
          anchor: [0.5, 1]
        })
      }));

      var m = new ol.Map({
        target: wrap,
        layers: [
          /* Esri's street tiles rather than ol.source.OSM: that default still
             points at the a/b/c.tile.openstreetmap.org subdomains, which no
             longer serve, so the map came up blank. Same provider as the
             satellite layer, so one attribution covers both. */
          new ol.layer.Tile({
            source: new ol.source.XYZ({
              attributions: 'Tiles &copy; Esri',
              url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
              maxZoom: 19
            })
          }),
          new ol.layer.Vector({ source: new ol.source.Vector({ features: [marker] }) })
        ],
        view: new ol.View({ center: centre, zoom: opts.zoom || 11, maxZoom: 19 })
      });
      watchSize(m, wrap);
    }
    return wrap;
  }

  /* Whatever we know about the place, in the form Google Maps searches best. */
  function googleUrl(place) {
    if (typeof place.lat === 'number' && typeof place.lon === 'number') {
      return 'https://www.google.com/maps/search/?api=1&query='
        + place.lat + '%2C' + place.lon;
    }
    var q = [place.city, place.country || place.name].filter(Boolean).join(', ') || place.name;
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
  }

  function directionsUrl(place) {
    var q = (typeof place.lat === 'number' && typeof place.lon === 'number')
      ? place.lat + '%2C' + place.lon
      : encodeURIComponent([place.city, place.country || place.name].filter(Boolean).join(', '));
    return 'https://www.google.com/maps/dir/?api=1&destination=' + q;
  }

  DD.map = { render: render, keyFor: keyFor, entries: entries, toScreen: function(){},
    road: road, googleUrl: googleUrl, directionsUrl: directionsUrl };
})();


/* ===== 10-front.js ===== */
/* 10-front — the front page: the whole ledger at a glance, the world map,
   and the trips themselves. Opening a trip takes you to its places. */
'use strict';

(function () {
  var el = DD.el, S = DD.store;

  DD.register('front', { title: 'Front Page', render: render });

  function render(host) {
    var db = S.db();
    var all = db.trips;

    /* ---- everything, added up ---- */
    var budget = 0, spent = 0, places = 0, days = 0, entries = 0, started = 0;
    all.forEach(function (t) {
      var b = S.tripBudget(t), a = S.actuals(t);
      budget += b.total; spent += a.total; places += b.places; days += b.days;
      entries += a.count;
      t.places.forEach(function (p) { if (S.placeState(t, p).count) started++; });
    });

    host.appendChild(el('p', { class: 'lede' }, [
      places
        ? 'Across ' + DD.plural(all.length, 'trip') + ' there are ' + DD.plural(places, 'destination')
          + ', ' + DD.money(budget) + ' budgeted over ' + DD.plural(days, 'day') + '. '
        : 'Nothing is planned yet. ',
      entries
        ? DD.money(spent) + ' has gone out across ' + DD.plural(entries, 'entry', 'entries')
          + ', and ' + started + ' of ' + places + ' places are under way.'
        : 'No spending logged yet — the map below fills in as you go.'
    ]));

    host.appendChild(DD.statStrip([
      DD.stat('Budgeted', DD.money(budget, { compact: true }), DD.plural(days, 'day') + ' in all', 'hero'),
      DD.stat('Spent', DD.money(spent, { compact: true }), DD.pct(spent, budget) + '% of budget'),
      DD.stat(spent > budget ? 'Over by' : 'Remaining', DD.money(Math.abs(budget - spent), { compact: true }),
        started ? started + ' places under way' : 'nothing started', spent > budget ? 'neg' : 'pos'),
      DD.stat('Per day', DD.money(days ? budget / days : 0), 'across the whole plan')
    ]));

    /* ---- the map ---- */
    var worldTrips = all.filter(function (t) { return t.kind !== 'domestic'; });
    if (worldTrips.length) {
      host.appendChild(DD.sectionHead('The world, so far', 'Where the money goes',
        el('span', { class: 'chip brand', text: DD.plural(started, 'place') + ' under way' })));
      host.appendChild(el('p', { class: 'deck' },
        'Filled countries are on the itinerary. They deepen once you start spending there — click any one to open it.'));
      host.appendChild(DD.map.render({
        kind: 'world',
        trips: worldTrips,
        onPick: function (e) { openPlace(e); },
        onIndia: openHomeTrip,
        onBlank: function (key, name) { offerAdd(key, name); }
      }));
      host.appendChild(el('p', { class: 'tiny muted', style: { marginTop: '8px' } },
        'Scroll or pinch to zoom, drag to move around. India opens your travels at home.'));
    }

    /* ---- global charts ---- */
    if (all.length > 0 && budget > 0) {
      host.appendChild(DD.sectionHead('Overview', 'Total across all trips'));
      
      var globalMode = spent > 0 ? 'spent' : 'budget';
      var globalBody = el('div', { class: 'card card-pad' });
      var globalInner = el('div', { style: { display: 'flex', gap: '24px', alignItems: 'center', flexWrap: 'wrap' } });
      
      var paintGlobal = function(which) {
        DD.clear(globalInner);
        
        var allCats = {};
        all.forEach(function(tr) {
          var tb = S.tripBudget(tr), ta = S.actuals(tr);
          tr.categories.forEach(function(c) {
            if (!allCats[c.id]) allCats[c.id] = { id: c.id, label: c.label, budget: 0, actual: 0 };
            allCats[c.id].budget += (tb.byCat[c.id] || 0);
            allCats[c.id].actual += (ta.byCat[c.id] || 0);
          });
        });
        var gData = Object.keys(allCats).map(function(k) { return allCats[k]; });

        /* Two trips share several category ids by colour — Flights and Flights &
           Rail are both navy — so hand out a distinct colour per merged head. */
        var colours = DD.charts.distinctColours(gData.map(function (c) { return c.id; }));

        var donutData = gData.map(function(c) {
          var val = which === 'spent' ? c.actual : c.budget;
          return { id: c.id, label: c.label, value: val, colour: colours[c.id] };
        }).filter(function(d) { return d.value > 0; }).sort(DD.by('value', 'desc'));

        var gDonut = DD.charts.donut(donutData, {
          centre: DD.money(DD.sum(donutData, function (d) { return d.value; }), { compact: true }),
          centreSub: which === 'spent' ? 'spent' : 'budget'
        });
        globalInner.appendChild(el('div', { class: 'chart-side' }, [
          gDonut,
          DD.charts.legend(donutData, gDonut)
        ]));

        var barsData = gData.filter(function(r) { return r.budget > 0 || r.actual > 0; })
          .sort(DD.by('budget', 'desc'));

        var detailsCol = el('div', { style: { flex: '1 1 300px', minWidth: '0' } });
        detailsCol.appendChild(DD.charts.verticalCompareBars(barsData, { colours: colours }));
        globalInner.appendChild(detailsCol);
      };
      
      paintGlobal(globalMode);
      if (spent > 0) {
        DD.append(globalBody, el('div', { style: { marginBottom: '14px' } }, [
          DD.segmented([['budget', 'Budget'], ['spent', 'Spent']], globalMode, paintGlobal)
        ]));
      }
      globalBody.appendChild(globalInner);
      host.appendChild(globalBody);
    }

    /* ---- where you are today, if a trip is running ---- */
    var live = null;
    all.forEach(function (t) {
      if (live) return;
      var w = S.whereToday(t);
      if (w) live = { trip: t, where: w };
    });
    if (live) host.appendChild(todayPanel(live.trip, live.where));

    /* ---- pacing: are you spending faster than the plan? ---- */
    var paceTrip = live ? live.trip : S.trip();
    var pace = S.pacing(paceTrip);
    if (pace && pace.state !== 'before') {
      host.appendChild(DD.sectionHead(paceTrip.name, 'Are you on budget?'));
      host.appendChild(paceBar(paceTrip, pace));
    }

    /* ---- trips ---- */
    host.appendChild(DD.sectionHead('The trips', 'Editions',
      el('button', { class: 'btn sm pri', onclick: newTrip }, [DD.icon('plus', 14), 'New trip'])));

    var grid = el('div', {
      style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(290px,1fr))', gap: '16px' }
    });
    all.forEach(function (t) { grid.appendChild(tripCard(t)); });
    host.appendChild(grid);

    /* ---- category split for the open trip ---- */
    var t = S.trip();
    var tb = S.tripBudget(t), ta = S.actuals(t);
    if (tb.places) {
      host.appendChild(DD.sectionHead(t.name, 'Where it is budgeted',
        el('button', { class: 'btn sm', onclick: function () { DD.go('sheet'); } }, 'Open the sheet')));

      var mode = ta.count ? 'spent' : 'budget';
      var body = el('div', { class: 'card card-pad' });
      var inner = el('div', { style: { display: 'flex', gap: '24px', alignItems: 'center', flexWrap: 'wrap' } });

      function paint(which) {
        DD.clear(inner);
        var src = which === 'spent' ? ta.byCat : tb.byCat;
        var colours = DD.charts.distinctColours(t.categories.map(function (c) { return c.id; }));
        var data = t.categories.map(function (c) {
          return { id: c.id, label: c.label, value: src[c.id] || 0, colour: colours[c.id] };
        }).filter(function (d) { return d.value > 0; }).sort(DD.by('value', 'desc'));

        var tDonut = DD.charts.donut(data, {
          centre: DD.money(DD.sum(data, function (d) { return d.value; }), { compact: true }),
          centreSub: which === 'spent' ? 'spent' : 'budget'
        });
        inner.appendChild(el('div', { class: 'chart-side' }, [
          tDonut,
          DD.charts.legend(data, tDonut)
        ]));

        var barsData = t.categories.map(function(c) {
          return { id: c.id, label: c.label, budget: tb.byCat[c.id] || 0, actual: ta.byCat[c.id] || 0 };
        }).filter(function(r) { return r.budget > 0 || r.actual > 0; }).sort(DD.by('budget', 'desc'));

        var detailsCol = el('div', { style: { flex: '1 1 300px', minWidth: '0' } });
        detailsCol.appendChild(DD.charts.verticalCompareBars(barsData, { colours: colours }));
        inner.appendChild(detailsCol);
      }
      paint(mode);
      DD.append(body, ta.count
        ? el('div', { style: { marginBottom: '14px' } }, [
            DD.segmented([['budget', 'Budget'], ['spent', 'Spent']], mode, paint)])
        : null);
      body.appendChild(inner);
      host.appendChild(body);
    }

    /* ---- recent spending, across every trip ---- */
    var recent = [];
    all.forEach(function (tr) {
      tr.expenses.forEach(function (x) { recent.push({ trip: tr, x: x }); });
    });
    recent.sort(DD.by(function (r) { return r.x.date; }, 'desc'));
    if (recent.length) {
      host.appendChild(DD.sectionHead('Latest', 'Money out',
        el('button', { class: 'btn sm', onclick: function () { DD.logForm(); } }, [DD.icon('plus', 14), 'Log spend'])));
      var list = el('div', { class: 'card list' });
      recent.slice(0, 7).forEach(function (r) {
        list.appendChild(DD.expenseRow(r.trip, r.x, { showTrip: all.length > 1 }));
      });
      host.appendChild(list);
    }

    /* ---- next few things planned ---- */
    var up = [];
    all.forEach(function (tr) {
      var sched = S.schedule(tr);
      tr.places.forEach(function (p) {
        (p.itinerary || []).forEach(function (it) {
          if (it.done) return;
          up.push({
            trip: tr, place: p, it: it,
            date: sched[p.id] && sched[p.id].start ? DD.addDays(sched[p.id].start, Math.max(0, (it.day || 1) - 1)) : ''
          });
        });
      });
    });
    if (up.length) {
      up.sort(DD.by('date'));
      host.appendChild(DD.sectionHead('Ahead', 'On the itinerary',
        el('button', { class: 'btn sm', onclick: function () { DD.go('itinerary'); } }, 'All of it')));
      var ul = el('div', { class: 'card list' });
      up.slice(0, 5).forEach(function (u) {
        ul.appendChild(el('div', { class: 'list-row' }, [
          el('span', { class: 'chip', text: u.date ? DD.shortDate(u.date) : 'Day ' + (u.it.day || 1) }),
          el('div', { class: 'grow' }, [
            el('div', { class: 't', text: u.it.title }),
            el('div', { class: 's', text: u.place.name + ' · ' + u.trip.name })
          ]),
          u.it.cost ? el('span', { class: 'amt', text: DD.money(u.it.cost) }) : null
        ]));
      });
      host.appendChild(ul);
    }
  }

  /* ----------------------------------------------------------- today */
  function todayPanel(t, w) {
    var st = S.placeState(t, w.place);
    var left = st.budget - st.spent;
    var daysLeftHere = w.daysHere - w.dayInPlace + 1;
    var todaysPlan = (w.place.itinerary || []).filter(function (i) { return i.day === w.dayInPlace; });

    var cols = el('div', { class: 'today-cols' }, [
      el('div', { class: 'today-col' }, [
        el('div', { class: 'k', text: 'Day' }),
        el('div', { class: 'v', text: w.dayInPlace + ' of ' + w.daysHere }),
        el('div', { class: 's', text: DD.plural(daysLeftHere, 'day') + ' left here' })
      ]),
      el('div', { class: 'today-col' }, [
        el('div', { class: 'k', text: left >= 0 ? 'Left here' : 'Over here' }),
        el('div', { class: 'v', style: { color: left >= 0 ? 'var(--green)' : 'var(--red)' },
          text: DD.money(Math.abs(left)) }),
        el('div', { class: 's', text: daysLeftHere > 0

      ]),
      el('div', { class: 'today-col' }, [
        el('div', { class: 'k', text: 'Next' }),
        el('div', { class: 'v', style: { fontSize: '17px' }, text: w.next ? w.next.name : 'Home' }),
        el('div', { class: 's', text: w.next ? DD.plural(w.next.days, 'day') + ' there' : 'end of the trip' })
      ])
    ]);

    var panel = el('div', { class: 'today' }, [
      el('div', { class: 'today-mark' }, [
        el('div', { class: 'k', text: 'Today · day ' + w.dayOfTrip + ' of ' + t.name }),
        el('h3', { text: w.place.name }),
        el('div', { class: 's', text: (w.place.city && w.place.city !== w.place.name ? w.place.city + ' · ' : '')

    var wrap = el('div', {}, [

        }, [DD.icon('plus', 14), 'Log spend here'])),

    if (todaysPlan.length) {

      todaysPlan.forEach(function (it) {
        list.appendChild(el('div', { class: 'list-row' }, [
          el('label', { class: 'inline-check', style: { margin: 0 } }, [
            el('input', { type: 'checkbox', checked: !!it.done,
              onchange: function () { it.done = this.checked; S.save(); DD.render(); } })
          ]),
          el('div', { class: 'grow' }, [
            el('div', { class: 't', text: it.title,
              style: it.done ? { textDecoration: 'line-through', color: 'var(--ink-3)' } : {} }),
            it.note ? el('div', { class: 's city-note', text: it.note }) : null
          ]),
          it.cost ? el('span', { class: 'amt small', text: DD.money(it.cost) }) : null
        ]));
      });
      wrap.appendChild(list);
    }
    return wrap;
  }

  /* ---------------------------------------------------------- pacing */
  function paceBar(t, pace) {
    var ahead = pace.delta <= 0;
    var scale = Math.max(pace.budget, pace.actual, pace.expected) || 1;
    var over = pace.actual > pace.expected;

    return el('div', { class: 'pace' }, [
      el('div', { class: 'pace-head' }, [
        el('span', { class: 'verdict ' + (ahead ? 'ahead' : 'behind'),
          text: pace.state === 'after'
            ? (ahead ? 'Came in under budget' : 'Finished over budget')
            : (ahead ? DD.money(Math.abs(pace.delta)) + ' in hand' : DD.money(pace.delta) + ' ahead of the plan') }),
        el('span', { class: 'muted small', style: { fontStyle: 'italic' },
          text: pace.state === 'after'
            ? 'The ' + DD.plural(pace.days, 'day') + ' are up.'
            : 'By day ' + pace.elapsed + ' of ' + pace.days + ' you would expect to have spent '
              + DD.money(pace.expected) + '. You have spent ' + DD.money(pace.actual) + '.' })
      ]),
      el('div', { class: 'pace-track' }, [
        el('div', { class: 'rail' }),
        el('div', { class: 'fill' + (over ? ' over' : ''),
          style: { width: Math.min(100, pace.actual / scale * 100) + '%' } }),
        el('div', { class: 'marker', 'data-label': 'on plan',
          style: { left: Math.min(99, pace.expected / scale * 100) + '%' } })
      ]),
      el('div', { class: 'pace-foot' }, [
        el('span', { text: DD.money(pace.perDay) + ' a day so far' }),
        el('span', { text: 'at this rate, ' + DD.money(pace.projected) + ' by the end' }),
        el('span', { text: 'budget ' + DD.money(pace.budget) })
      ])
    ]);
  }

  /* Clicking India on the world map is a doorway to the trip at home. */
  function openHomeTrip() {
    var home = S.db().trips.filter(function (t) { return t.kind === 'domestic'; })[0];
    if (!home) {
      DD.toast('No trip at home yet — make one from the trips below', true);
      return;
    }
    S.setTrip(home.id);
    DD.go('places');
    DD.toast('Within India');
  }

  /* --------------------------------------------------------- trip card */
  function tripCard(t) {
    var b = S.tripBudget(t), a = S.actuals(t);
    var active = t.id === S.trip().id;
    var lead = null;
    for (var i = 0; i < t.places.length && !lead; i++) {
      if (t.places[i].images && t.places[i].images[0]) lead = t.places[i].images[0].url;
    }
    var noun = t.kind === 'domestic' ? ['city', 'cities'] : ['country', 'countries'];

    var hero = el('div', {
      class: 'trip-hero' + (lead ? ' photo' : ''),
      style: lead ? { backgroundImage: 'url("' + lead.replace(/"/g, '%22') + '")' } : {}
    }, [
      el('div', { class: 'k', text: t.kind === 'domestic' ? 'At home' : 'Abroad' }),
      el('h3', { text: t.name }),
      el('div', { class: 's', text: DD.plural(t.places.length, noun[0], noun[1]) + ' · ' + DD.plural(b.days, 'day') })
    ]);

    var card = el('div', {
      class: 'trip-card' + (active ? ' on' : ''),
      'data-trip': t.id,
      onclick: function (e) {
        if (e.target.closest('button')) return;
        S.setTrip(t.id);
        DD.go('places');
      }
    }, [
      hero,
      el('div', { class: 'trip-body' }, [
        el('div', { class: 'place-nums' }, [
          el('span', { class: 'big', text: DD.money(b.total, { compact: true }) }),
          el('span', { class: 'muted tiny sans', text: 'budget' }),
          el('span', { style: { flex: '1' } }),
          a.total ? el('span', { class: 'num', style: { fontWeight: '700' }, text: DD.money(a.total, { compact: true }) + ' spent' }) : null
        ]),
        DD.progressBar(a.total, b.total),
        el('div', { class: 'place-meta' }, [
          el('span', { class: 'chip', text: DD.plural(a.count, 'entry', 'entries') }),
          t.start ? el('span', { class: 'chip', text: DD.shortDate(t.start) }) : null,
          active ? el('span', { class: 'chip brand', text: 'Open' }) : null
        ]),
        el('div', { class: 'place-acts' }, [
          el('button', { class: 'btn xs pri', onclick: function () { S.setTrip(t.id); DD.go('places'); } },
            'Open ' + (t.kind === 'domestic' ? 'cities' : 'countries')),
          el('button', { class: 'btn xs', onclick: function () { editTrip(t); } }, 'Edit'),
          el('button', { class: 'btn xs ghost', onclick: function () { duplicate(t); } }, 'Duplicate')
        ])
      ])
    ]);
    return card;
  }

  /* Clicking a country on the map: switch to its trip and open the place. */
  function openPlace(e) {
    if (e.trip.id !== S.trip().id) S.setTrip(e.trip.id);
    DD.placeEditor(e.trip, e.place);
  }

  function offerAdd(key, name) {
    var t = S.trip();
    if (t.kind === 'domestic') return;
    DD.confirmBox('Add ' + name + '?',
      'It goes on to ' + t.name + ' with ' + DD.plural(t.defaultDays, 'day') + ' and an empty budget, ready for you to fill in.',
      function () {
        var p = S.addPlace(t, { name: name, country: name, iso2: key, days: t.defaultDays, currency: 'INR' });
        DD.render();
        DD.toast(name + ' added to ' + t.name);
        DD.images.ensureLead(p, function (got) { if (got) DD.render(); });
      }, 'Add it');
  }

  /* -------------------------------------------------------------- trips */
  function newTrip() {
    var nameIn = el('input', { type: 'text', placeholder: 'Southeast Asia 2027' });
    var kind = 'world';
    var startIn = el('input', { type: 'date' });
    var daysIn = el('input', { type: 'number', min: '1', value: '10' });

    DD.modal({
      title: 'New trip',
      body: el('div', {}, [
        DD.field('Trip name', nameIn),
        el('span', { class: 'lbl-cap', text: 'Kind' }),
        el('div', { style: { marginBottom: '14px' } }, [
          DD.segmented([['world', 'Abroad — by country'], ['domestic', 'At home — by city']], 'world', function (v) {
            kind = v;
            daysIn.value = v === 'domestic' ? '4' : '10';
          })
        ]),
        el('div', { class: 'grid2' }, [
          DD.field('Start date', startIn),
          DD.field('Default days per stop', daysIn)
        ])
      ]),
      okLabel: 'Create',
      ok: function (close) {
        var n = nameIn.value.trim();
        if (!n) { nameIn.focus(); DD.toast('Give the trip a name', true); return; }
        S.addTrip({ name: n, kind: kind, start: startIn.value, defaultDays: Number(daysIn.value) || 10 });
        close();
        DD.go('places');
        DD.toast(n + ' created');
      }
    });
  }

  function editTrip(t) {
    var nameIn = el('input', { type: 'text', value: t.name });
    var startIn = el('input', { type: 'date', value: t.start || '' });
    var daysIn = el('input', { type: 'number', min: '1', value: String(t.defaultDays) });
    var noteIn = el('textarea', {});
    noteIn.value = t.note || '';

    DD.modal({
      title: 'Edit trip',
      body: el('div', {}, [
        DD.field('Name', nameIn),
        el('div', { class: 'grid2' }, [
          DD.field('Start date', startIn),
          DD.field('Default days per stop', daysIn)
        ]),
        DD.field('Note', noteIn)
      ]),
      okLabel: 'Save',
      destructive: S.db().trips.length > 1 ? {
        label: 'Delete trip',
        run: function (close) {
          close();
          DD.confirmBox('Delete ' + t.name + '?',
            'Its ' + DD.plural(t.places.length, 'place') + ' and ' + DD.plural(t.expenses.length, 'expense') + ' go too.',
            function () { S.removeTrip(t.id); DD.render(); DD.toast('Trip deleted'); });
        }
      } : null,
      ok: function (close) {
        t.name = nameIn.value.trim() || t.name;
        t.start = startIn.value;
        t.defaultDays = Number(daysIn.value) || t.defaultDays;
        t.note = noteIn.value.trim();
        S.save(); close(); DD.render();
      }
    });
  }

  function duplicate(t) {
    var copy = S.deepClone(t);
    copy.id = DD.uid('trip');
    copy.name = t.name + ' (copy)';
    copy.expenses = [];
    copy.places.forEach(function (p) {
      p.id = DD.uid('p');
      p.itinerary = (p.itinerary || []).map(function (i) {
        var c = S.deepClone(i); c.id = DD.uid('it'); c.done = false; return c;
      });
    });
    S.db().trips.push(copy);
    S.db().activeTrip = copy.id;
    S.save();
    DD.render();
    DD.toast('Copied — places and budget kept, spending cleared');
  }

  DD.newTrip = newTrip;
  DD.openHomeTrip = openHomeTrip;
  DD.paceBar = paceBar;
  DD.todayPanel = todayPanel;
})();


/* ===== 20-places.js ===== */
/* 20-places — Countries abroad, Cities at home. Each trip's map, its places,
   and its ledger of spending all live on this one page. */
'use strict';

(function () {
  var el = DD.el, S = DD.store, icon = DD.icon;

  /* Filter and sort are remembered while the app is open, per trip kind, so
     switching to the sheet and back does not lose your place. */
  var view = { query: '', by: 'order', dir: 'asc' };

  var GRADIENT = 'linear-gradient(160deg,var(--brand-900),var(--brand-700) 60%,var(--brand-600))';
  function photoLayers(url) {
    return 'url("' + String(url).replace(/"/g, '%22') + '"), ' + GRADIENT;
  }

  DD.register('places', {
    title: function () { return DD.placesLabel(); },
    render: render
  });

  function render(host) {
    var t = S.trip();
    /* A domestic place is a state: that is the level the India sheet budgets at
       and the level the map fills at. Its towns live on the Cities page. */
    var isCity = t.kind === 'domestic';
    var list = S.places(t);
    var noun = isCity ? ['state', 'states'] : ['country', 'countries'];

    if (!list.length) {
      if (isCity) host.appendChild(viewToggle('places'));
      host.appendChild(el('p', { class: 'lede' },
        'Nothing on ' + t.name + ' yet. Add the ' + noun[1] + ' you mean to visit — each one gets a photo, '
        + 'a starter budget of ' + DD.plural(t.defaultDays, 'day') + ', and booking links.'));
      host.appendChild(DD.emptyState('No ' + noun[1] + ' yet', '', 'Add a ' + noun[0], addDialog));
      return;
    }

    if (isCity) host.appendChild(viewToggle('places'));

    var b = S.tripBudget(t), a = S.actuals(t);
    var started = list.filter(function (p) { return S.placeState(t, p).count; }).length;

    host.appendChild(DD.statStrip([
      DD.stat('Budgeted', DD.money(b.total, { compact: true }),
        DD.plural(b.days, 'day') + ' · ' + DD.money(b.days ? b.total / b.days : 0) + ' a day', 'hero'),
      DD.stat('Spent', DD.money(a.total, { compact: true }), DD.pct(a.total, b.total) + '% of budget'),
      DD.stat(a.total > b.total ? 'Over by' : 'Remaining', DD.money(Math.abs(b.total - a.total), { compact: true }),
        '', a.total > b.total ? 'neg' : 'pos'),
      DD.stat(isCity ? 'States' : 'Countries', String(list.length), started + ' under way')
    ]));

    var pace = S.pacing(t);
    if (pace && pace.state !== 'before' && DD.paceBar) {
      host.appendChild(el('div', { style: { marginTop: '16px' } }, [DD.paceBar(t, pace)]));
    }

    var w = S.whereToday(t);
    if (w) {
      host.appendChild(el('div', { class: 'banner info', style: { marginTop: '16px' } }, [
        el('div', {}, ['You are in ', el('strong', { text: w.place.name }), ' today — day ',
          String(w.dayInPlace), ' of ', String(w.daysHere), '. ',
          el('button', { class: 'btn xs', onclick: function () { editor(t, w.place); } }, 'Open it')])
      ]));
    }

    /* ---- the trip's own map ---- */
    var kind = isCity ? 'india' : 'world';
    host.appendChild(DD.sectionHead(t.name, isCity ? 'The route through India' : 'The route',
      el('button', { class: 'btn sm pri', onclick: addDialog }, [icon('plus', 14), 'Add ' + noun[0]])));
    host.appendChild(el('p', { class: 'deck' }, isCity
      ? 'States you are stopping in are filled; a dot marks each city. Colour deepens once you spend there.'
      : 'Countries on the itinerary are filled, and deepen as you spend. Click an empty one to add it.'));
    host.appendChild(DD.map.render({
      kind: kind,
      trips: [t],
      onPick: function (e) { editor(t, e.place); },
      onIndia: kind === 'world' ? DD.openHomeTrip : null,
      onBlank: kind === 'world' ? function (key, name) { offerAdd(t, key, name); } : null
    }));
    host.appendChild(el('p', { class: 'tiny muted', style: { marginTop: '8px' } },
      'Scroll or pinch to zoom, drag to move around.'
      + (kind === 'world' ? ' India opens your travels at home.' : '')));

    /* ---- trip level charts ---- */
    if (b.total > 0) {
      host.appendChild(DD.sectionHead('Overview', 'Category breakdown'));
      var tripMode = a.total > 0 ? 'spent' : 'budget';
      var tripBody = el('div', { class: 'card card-pad', style: { marginBottom: '16px' } });
      var tripInner = el('div', { style: { display: 'flex', gap: '24px', alignItems: 'center', flexWrap: 'wrap' } });
      
      var paintTrip = function(which) {
        DD.clear(tripInner);
        var src = which === 'spent' ? a.byCat : b.byCat;
        var data = t.categories.map(function(c, i) {
          return { id: c.id, label: c.label, value: src[c.id] || 0, colour: DD.charts.colourFor(c.id, i) };
        }).filter(function(d) { return d.value > 0; }).sort(DD.by('value', 'desc'));
        
        tripInner.appendChild(el('div', { style: { flex: '0 0 auto', margin: '0 auto' } }, [
          DD.charts.donut(data, {
            centre: DD.money(DD.sum(data, function (d) { return d.value; }), { compact: true }),
            centreSub: which === 'spent' ? 'spent' : 'budget'
          })
        ]));
        
        var barsData = t.categories.map(function(c) {
          return { id: c.id, label: c.label, budget: b.byCat[c.id] || 0, actual: a.byCat[c.id] || 0 };
        }).filter(function(r) { return r.budget > 0 || r.actual > 0; });
        
        var detailsCol = el('div', { style: { flex: '1 1 240px', minWidth: '0' } });
        detailsCol.appendChild(DD.charts.verticalCompareBars(barsData));
        tripInner.appendChild(detailsCol);
      };
      
      paintTrip(tripMode);
      if (a.total > 0) {
        DD.append(tripBody, el('div', { style: { marginBottom: '14px' } }, [
          DD.segmented([['budget', 'Budget'], ['spent', 'Spent']], tripMode, paintTrip)
        ]));
      }
      tripBody.appendChild(tripInner);
      host.appendChild(tripBody);
    }


    /* ---- the places ---- */
    /* The grid repaints itself as you type or re-sort. A full DD.render() would
       rebuild the page, throw away the focused search box and jump back to the
       top of the page on every keystroke. */
    var countChip = el('span', { class: 'chip' });
    var headNode = DD.sectionHead('In order', isCity ? 'The states' : 'The countries', countChip);
    host.appendChild(headNode);

    var bar = sortBar(t, list, noun, repaint);
    host.appendChild(bar.node);

    var gridWrap = el('div', {});
    host.appendChild(gridWrap);
    repaint();

    function repaint() {
      var shown = arrange(t, list);
      var kicker = headNode.querySelector('.kicker');
      if (kicker) kicker.textContent = view.by === 'order' ? 'In order' : 'Sorted';
      countChip.textContent = shown.length === list.length
        ? DD.plural(list.length, noun[0], noun[1])

      bar.refresh();

      DD.clear(gridWrap);
      if (!shown.length) {

        ]));

      }
      var grid = el('div', { class: 'places' });
      shown.forEach(function (p) { grid.appendChild(card(t, p, list.indexOf(p), list.length)); });

      if (view.by === 'order') {
        makeSortable(grid, t);
        gridWrap.appendChild(el('p', { class: 'drag-hint', style: { marginTop: '9px' } },

      } else {
