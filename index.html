      }
    }

    host.appendChild(el('div', { style: { marginTop: '16px', textAlign: 'center' } }, [
      el('button', { class: 'btn', onclick: addDialog }, [icon('plus', 14), 'Add another ' + noun[0]])
    ]));

    /* ---- this trip's ledger ---- */
    host.appendChild(DD.sectionHead('The ledger', 'What ' + t.name + ' actually cost',
      el('button', { class: 'btn sm pri', onclick: function () { DD.logForm({ trip: t }); } },
        [icon('plus', 14), 'Log spend'])));
    host.appendChild(DD.expenseLedger(t));
  }

  /* A trip at home has two views of the same route: the states that carry the
     budget, and the towns you pass through. */
  function viewToggle(current) {
    return el('div', { style: { marginBottom: '16px' } }, [
      DD.segmented([['places', 'States'], ['cities', 'Cities']], current, function (v) {
        if (v !== current) DD.go(v);
      })
    ]);
  }

  /* Drag a card on to another to slot it in there. Touch keeps the arrows. */
  function makeSortable(grid, t) {
    var dragId = null;

    DD.$$('.place', grid).forEach(function (node) {
      node.draggable = true;

      node.addEventListener('dragstart', function (ev) {
        dragId = node.dataset.place;
        node.classList.add('dragging');
        ev.dataTransfer.effectAllowed = 'move';
        try { ev.dataTransfer.setData('text/plain', dragId); } catch (e) { /* IE-ism */ }
      });

      node.addEventListener('dragend', function () {
        dragId = null;
        DD.$$('.place', grid).forEach(function (n) {
          n.classList.remove('dragging', 'drop-before', 'drop-after');
        });
      });

      node.addEventListener('dragover', function (ev) {
        if (!dragId || node.dataset.place === dragId) return;
        ev.preventDefault();
        ev.dataTransfer.dropEffect = 'move';
        var r = node.getBoundingClientRect();
        var after = (ev.clientX - r.left) > r.width / 2;
        node.classList.toggle('drop-after', after);
        node.classList.toggle('drop-before', !after);
      });

      node.addEventListener('dragleave', function () {
        node.classList.remove('drop-before', 'drop-after');
      });

      node.addEventListener('drop', function (ev) {
        ev.preventDefault();
        if (!dragId || node.dataset.place === dragId) return;
        var list = S.places(t);
        var to = list.findIndex(function (p) { return p.id === node.dataset.place; });
        var from = list.findIndex(function (p) { return p.id === dragId; });
        if (to < 0 || from < 0) return;
        if (node.classList.contains('drop-after') && from > to) to += 1;
        if (node.classList.contains('drop-before') && from < to) to -= 1;
        if (S.reorderPlace(t, dragId, to)) {
          DD.render();
          DD.toast('Route reordered');
        }
      });
    });
  }

  /* ------------------------------------------------------ filter & sort */

  /* What you can rank a place by. Categories come from the trip, so the India
     trip offers Petrol and the world trip offers Visa. */
  function metrics(t) {
    var out = [
      { id: 'order', label: 'Route order' },
      { id: 'total', label: 'Total budget' },
      { id: 'perDay', label: 'Cost a day' },
      { id: 'days', label: 'Days' },
      { id: 'spent', label: 'Actually spent' },
      { id: 'left', label: 'Left to spend' }
    ];
    t.categories.forEach(function (c) { out.push({ id: 'cat:' + c.id, label: c.label }); });
    return out;
  }

  function valueOf(t, p, by) {
    var b = S.placeBudget(t, p);
    if (by === 'total') return b.total;
    if (by === 'perDay') return p.days ? b.total / p.days : 0;
    if (by === 'days') return Number(p.days) || 0;
    if (by === 'spent') return S.placeState(t, p).spent;
    if (by === 'left') return b.total - S.placeState(t, p).spent;
    if (by.indexOf('cat:') === 0) return Number(p.budget[by.slice(4)]) || 0;
    return Number(p.order) || 0;
  }

  /* Categories differ between trips — the world has Visa, India has Petrol — so
     a sort carried over from the other trip may not exist here. Fall back. */
  function normalise(t) {
    var ok = metrics(t).some(function (m) { return m.id === view.by; });
    if (!ok) { view.by = 'order'; view.dir = 'asc'; }
    return view.by;
  }

  function arrange(t, list) {
    normalise(t);
    var q = view.query.trim().toLowerCase();
    var out = list.filter(function (p) {
      if (!q) return true;
      return (p.name + ' ' + (p.city || '') + ' ' + (p.country || '') + ' ' + p.currency)
        .toLowerCase().indexOf(q) >= 0;
    });
    if (view.by === 'order') return out;
    var sign = view.dir === 'desc' ? -1 : 1;
    return out.slice().sort(function (a, b) {
      var d = (valueOf(t, a, view.by) - valueOf(t, b, view.by)) * sign;
      return d || (a.order - b.order);
    });
  }

  function sortBar(t, list, noun, repaint) {
    normalise(t);
    var search = el('input', {
      type: 'text', value: view.query,
      placeholder: 'Find a ' + noun[0] + '\u2026',
      oninput: DD.debounce(function () { view.query = search.value; repaint(); }, 180)
    });

    var sel = DD.selectOf(metrics(t).map(function (m) { return [m.id, m.label]; }), view.by,
      function (v) { view.by = v; repaint(); });

    var dirWrap = el('div', { class: 'sb-dir' });
    var clearWrap = el('div', { class: 'sb-clear' });
    var summary = el('span', { class: 'drag-hint' });

    var node = el('div', { class: 'sortbar' }, [
      el('div', { class: 'sortbar-row' }, [
        el('div', { class: 'sb-find' }, [search]),
        el('label', { class: 'sb-by' }, [el('span', { class: 'lbl-cap', text: 'Sort by' }), sel]),
        dirWrap,
        clearWrap
      ]),
      summary
    ]);

    /* Only the bits that depend on the sort get rebuilt, so the search box
       keeps its focus and caret while you type. */
    function refresh() {
      DD.clear(dirWrap);
      if (view.by !== 'order') {
        dirWrap.appendChild(DD.segmented([['asc', 'Cheapest first'], ['desc', 'Priciest first']],
          view.dir, function (v) { view.dir = v; repaint(); }));
      }

      DD.clear(clearWrap);
      if (view.query || view.by !== 'order') {
        clearWrap.appendChild(el('button', { class: 'btn xs ghost', text: 'Clear', onclick: function () {
          view.query = ''; view.by = 'order'; view.dir = 'asc';
          search.value = '';
          repaint();
        } }));
      }

      summary.textContent = '';
      if (view.by !== 'order') {
        var m = metrics(t).filter(function (x) { return x.id === view.by; })[0];
        var top = arrange(t, list)[0];
        if (m && top) {
          summary.textContent = (view.dir === 'asc' ? 'Cheapest' : 'Dearest') + ' on '
            + m.label.toLowerCase() + ': ' + top.name + ' at ' + DD.money(valueOf(t, top, view.by));
        }
      }
    }

    return { node: node, refresh: refresh };
  }

  /* --------------------------------------------------------------- card */
  function card(t, p, idx, total) {
    var bud = S.placeBudget(t, p);
    var st = S.placeState(t, p);
    var img = p.images && p.images[0];

    var photo = el('div', {
      class: 'place-photo',
      title: 'Open ' + p.name,
      onclick: function () { editor(t, p); }
    }, [
      poster(p),
      el('div', { class: 'ord', text: String(idx + 1).padStart(2, '0') }),
      st.count
        ? el('div', { class: 'state ' + st.state,
            text: st.state === 'over' ? 'Over budget' : st.state === 'done' ? 'Done' : 'Under way' })
        : (p.iso2 ? el('div', { class: 'flag', text: DD.flagOf(p.iso2) }) : null),
      el('div', { class: 'cap' }, [
        el('div', { class: 'n', text: p.name }),
        el('div', { class: 'c', text: subtitle(p) })
      ])
    ]);
    if (!img) tryPhoto(p, photo);

    var body = el('div', { class: 'place-body' }, [
      el('div', { class: 'place-nums' }, [
        el('span', { class: 'big', text: DD.money(bud.total, { compact: true }) }),
        el('span', { class: 'muted tiny sans', text: 'budget' }),
        el('span', { style: { flex: '1' } }),
        st.count ? el('span', {
          class: 'num', style: { fontWeight: '700', color: st.state === 'over' ? 'var(--red)' : 'var(--brand-800)' },
          text: DD.money(st.spent, { compact: true })
        }) : null
      ]),
      DD.progressBar(st.spent, bud.total),
      el('div', { class: 'place-meta' }, [
        stepper(t, p),
        el('span', { class: 'chip', text: p.currency }),
        el('span', { class: 'chip', text: DD.money(p.days ? bud.total / p.days : 0) + '/day' })
      ]),
      fxLine(p),
      /* Log leads. Open is gone — the whole card already opens the place.
         The booking links bring up the rear, where you go once the plan is set. */
      el('div', { class: 'place-acts' }, [
        el('button', { class: 'btn xs pri', onclick: function () { DD.logForm({ trip: t, placeId: p.id }); } },
          [icon('plus', 12), 'Log']),
        el('button', { class: 'btn xs', title: 'Streets and Google Maps',
          onclick: function () { editor(t, p, { tab: 'map' }); } }, [icon('map', 12), 'Map']),
        idx > 0 ? el('button', { class: 'btn xs ghost', title: 'Move earlier',
          onclick: function () { S.movePlace(t, p.id, -1); DD.render(); } }, '↑') : null,
        idx < total - 1 ? el('button', { class: 'btn xs ghost', title: 'Move later',
          onclick: function () { S.movePlace(t, p.id, 1); DD.render(); } }, '↓') : null,
        el('span', { class: 'acts-gap' }),
        el('button', { class: 'btn xs', onclick: function () { DD.links.open('flights', p); } }, DD.links.label('flights')),
        el('button', { class: 'btn xs', onclick: function () { DD.links.open('stays', p); } }, DD.links.label('stays'))
      ])
    ]);

    return el('div', { class: 'place', 'data-place': p.id }, [photo, body]);
  }

  /* The mental-arithmetic line: what ₹100 buys, for use at a counter. */
  function fxLine(p) {
    if (!p.currency || p.currency === 'INR') return null;
    var rate = DD.rateFor(p.currency, S.db().currencies);
    if (!rate || rate === 1) return null;
    var hundred = 100 * rate;
    /* Going the other way, one dong is worth ₹0.004 — useless. Step the unit up
       by powers of ten until the rupee figure is a number you can hold in mind. */
    var unit = 1 / rate, mult = 1;
    while (unit * mult < 1 && mult < 1000000) mult *= 10;
    var back = unit * mult;
    return el('div', { class: 'fx-line' }, [
      '₹100 = ', el('b', { text: DD.num(hundred, hundred < 10 ? 2 : 0) + ' ' + p.currency }),
      '   ·   ' + DD.num(mult) + ' ' + p.currency + ' = ',
      el('b', { text: '₹' + DD.num(back, back < 100 ? 2 : 0) })
    ]);
  }

  /* The poster: two stacked layers so a place with several photos can fade from
     one to the next. One timer drives every visible card. */
  var rotators = [];
  var rotateTimer = null;

  function poster(p) {
    var urls = (p.images || []).map(function (im) { return im.url; }).filter(Boolean);
    var wrap = el('div', { class: 'pp' });
    var a = el('div', { class: 'pp-layer on' });
    var b = el('div', { class: 'pp-layer' });
    wrap.appendChild(a);
    wrap.appendChild(b);

    if (urls.length) a.style.backgroundImage = 'url("' + urls[0].replace(/"/g, '%22') + '")';

    if (urls.length > 1) {
      var pips = el('div', { class: 'pp-pips' });
      urls.forEach(function (u, i) { pips.appendChild(el('i', { class: i ? '' : 'on' })); });
      wrap.appendChild(pips);
      rotators.push({ node: wrap, urls: urls, layers: [a, b], pips: pips, i: 0, front: 0 });
      startRotation();
    }
    return wrap;
  }

  function startRotation() {
    if (rotateTimer) return;
    rotateTimer = setInterval(function () {
      rotators = rotators.filter(function (r) { return r.node.isConnected; });
      if (!rotators.length) { clearInterval(rotateTimer); rotateTimer = null; return; }
      rotators.forEach(advance);
    }, 5200);
  }

  function advance(r) {
    r.i = (r.i + 1) % r.urls.length;
    var back = r.layers[1 - r.front];
    back.style.backgroundImage = 'url("' + r.urls[r.i].replace(/"/g, '%22') + '")';
    back.classList.add('on');
    r.layers[r.front].classList.remove('on');
    r.front = 1 - r.front;
    DD.$$('i', r.pips).forEach(function (pip, n) { pip.classList.toggle('on', n === r.i); });
  }

  /* Whichever of city / region is not already the card's title. */
  function subtitle(p) {
    var extra = [p.city, p.country].filter(function (v) { return v && v !== p.name; })[0];
    return (extra ? extra + ' · ' : '') + DD.plural(p.days, 'day');
  }

  function stepper(t, p) {
    var n = el('span', { class: 'n', text: DD.plural(p.days, 'day') });
    return el('span', { class: 'stepper' }, [
      el('button', { 'aria-label': 'One day fewer', text: '−', onclick: function () {
        p.days = Math.max(1, (Number(p.days) || 1) - 1); n.textContent = DD.plural(p.days, 'day'); S.save();
      } }),
      n,
      el('button', { 'aria-label': 'One day more', text: '+', onclick: function () {
        p.days = (Number(p.days) || 0) + 1; n.textContent = DD.plural(p.days, 'day'); S.save();
      } })
    ]);
  }

  function tryPhoto(p, node) {
    DD.images.ensureLead(p, function (got) {
      if (!got || !p.images[0]) return;
      var layer = node.querySelector('.pp-layer');
      if (layer) layer.style.backgroundImage = 'url("' + p.images[0].url.replace(/"/g, '%22') + '")';
    });
  }

  function offerAdd(t, key, name) {
    DD.confirmBox('Add ' + name + '?',
      'It joins ' + t.name + ' with ' + DD.plural(t.defaultDays, 'day') + ' and an empty budget.',
      function () {
        var p = S.addPlace(t, { name: name, country: name, iso2: key, days: t.defaultDays, currency: 'INR' });
        DD.render();
        DD.toast(name + ' added');
        DD.images.ensureLead(p, function (got) { if (got) DD.render(); });
      }, 'Add it');
  }

  /* --------------------------------------------------------- add dialog */
  function addDialog() {
    var t = S.trip();
    var isCity = t.kind === 'domestic';
    var nameIn = el('input', { type: 'text', placeholder: isCity ? 'Rajasthan' : 'Portugal', autocapitalize: 'words' });
    var cityIn = el('input', { type: 'text', placeholder: isCity ? 'Jaipur' : 'Lisbon' });
    var daysIn = el('input', { type: 'number', min: '1', value: String(t.defaultDays) });
    var curIn = currencySelect('INR', null);
    var isoIn = el('input', { type: 'text', maxlength: '2', placeholder: 'PT', style: { textTransform: 'uppercase' } });
    var iataIn = el('input', { type: 'text', maxlength: '3', placeholder: 'LIS', style: { textTransform: 'uppercase' } });

    DD.modal({
      title: isCity ? 'Add a state' : 'Add a country',
      body: el('div', {}, [
        DD.field(isCity ? 'State — this fills the map' : 'Country', nameIn),
        DD.field(isCity ? 'Gateway city' : 'Main city', cityIn),
        el('div', { class: 'grid2' }, [DD.field('Days', daysIn), DD.field('Currency', curIn)]),
        el('div', { class: 'grid2' }, [
          DD.field(isCity ? 'Country code' : 'Country code', isoIn),
          DD.field('Airport', iataIn)
        ]),
        el('p', { class: 'tiny muted', style: { margin: '2px 0 0' } }, isCity
          ? 'The state name fills that part of the India map; the gateway city places the dot and finds a photo. Add the towns day by day under Plan.'
          : 'The country code fills the map and gives you a flag; the airport code builds the flight link.')
      ]),
      okLabel: 'Add',
      ok: function (close) {
        var name = nameIn.value.trim();
        if (!name) { nameIn.focus(); DD.toast('Give it a name first', true); return; }
        var p = S.addPlace(t, {
          name: name,
          country: name,
          city: cityIn.value.trim() || name,
          iso2: isoIn.value.trim().toUpperCase() || (isCity ? 'IN' : ''),
          iata: iataIn.value.trim().toUpperCase(),
          currency: curIn.value,
          days: Number(daysIn.value) || t.defaultDays
        });
        close();
        DD.render();
        DD.toast(name + ' added');
        DD.images.ensureLead(p, function (got) { if (got) DD.render(); });
      }
    });
  }

  /* The currency dropdown, with a way to add one that is not listed. */
  function currencySelect(value, onPick) {
    var sel = DD.selectOf(currencyOptions().concat([['__add', '+  Add a currency\u2026']]), value,
      function (v) {
        if (v !== '__add') { value = v; if (onPick) onPick(v); return; }
        sel.value = value;                       /* put it back while the dialog is open */
        addCurrency(function (code) {
          value = code;
          DD.clear(sel);
          currencyOptions().concat([['__add', '+  Add a currency\u2026']]).forEach(function (o) {
            sel.appendChild(el('option', { value: o[0], selected: o[0] === code }, o[1]));
          });
          sel.value = code;
          if (onPick) onPick(code);
        });
      });
    return sel;
  }

  function addCurrency(done) {
    var code = el('input', { type: 'text', maxlength: '4', placeholder: 'AUD', style: { textTransform: 'uppercase' } });
    var name = el('input', { type: 'text', placeholder: 'Australian Dollar' });
    var rate = el('input', { type: 'number', step: 'any', min: '0', placeholder: '0.018' });
    DD.modal({
      title: 'Add a currency',
      body: el('div', {}, [
        el('div', { class: 'grid3' }, [
          DD.field('Code', code), DD.field('Name', name), DD.field('Units per \u20b91', rate)
        ]),
        el('p', { class: 'tiny muted', style: { margin: 0 } },
          'How many of it you get for one rupee \u2014 the same way column B of your sheet reads. '
          + 'You can change it later under Almanac \u2192 Exchange rates.')
      ]),
      okLabel: 'Add',
      ok: function (close) {
        var c = code.value.trim().toUpperCase();
        var r = Number(rate.value);
        if (!c || !r || r <= 0) { DD.toast('Need a code and a rate above zero', true); return; }
        S.db().currencies[c] = { name: name.value.trim() || c, perINR: r };
        S.save();
        close();
        DD.toast(c + ' added');
        done(c);
      }
    });
  }

  function currencyOptions() {
    var cur = S.db().currencies;
    return Object.keys(cur).sort().map(function (c) { return [c, c + ' — ' + cur[c].name]; });
  }

  /* ------------------------------------------------------------- editor */
  function editor(t, p, opts) {
    var body = el('div', {});
    var tabs = el('div', { class: 'seg', style: { marginBottom: '16px', flexWrap: 'wrap' } });
    var pane = el('div', {});
    /* Logging is what you open this for while you are actually travelling, so
       it leads; the budget you set once sits behind it. */
    var TABS = [['spend', 'Log'], ['budget', 'Budget'], ['map', 'Road map'],
                ['photos', 'Photos'], ['drive', 'Albums'], ['plan', 'Plan'], ['about', 'Details']];
    var activeTab = opts && opts.tab ? opts.tab : 'spend';

    function paint() {
      DD.clear(tabs);
      TABS.forEach(function (tb) {
        tabs.appendChild(el('button', {
          class: tb[0] === activeTab ? 'on' : '', text: tb[1],
          onclick: function () { activeTab = tb[0]; paint(); }
        }));
      });
      DD.clear(pane);
      ({ budget: budgetPane, spend: spendPane, map: mapPane, photos: photosPane,
         drive: drivePane, plan: planPane, about: aboutPane })[activeTab](t, p, pane);
    }
    body.appendChild(tabs);
    body.appendChild(pane);
    paint();

    DD.modal({
      title: p.name + (p.city && p.city !== p.name ? ' · ' + p.city : ''),
      body: body, wide: true, cancelLabel: 'Done',
      destructive: {
        label: 'Remove',
        run: function (close) {
          close();
          DD.confirmBox('Remove ' + p.name + '?',
            'Its budget, photos, plan and ' + DD.plural(
              t.expenses.filter(function (x) { return x.placeId === p.id; }).length, 'logged expense')
            + ' go with it.',
            function () { S.removePlace(t, p.id); DD.render(); DD.toast(p.name + ' removed'); });
        }
      },
      ok: function (close) { close(); DD.render(); }
    });
  }

  var saveSoon = DD.debounce(function () { S.save(); }, 400);

  /* ----- budget ----- */
  function budgetPane(t, p, host) {
    var totalNode = el('span', { class: 'num', style: { fontWeight: '800', fontSize: '21px' } });
    var perDayNode = el('span', { class: 'muted small' });

    function recalc() {
      var b = S.placeBudget(t, p);
      totalNode.textContent = DD.money(b.total);
      perDayNode.textContent = DD.money(p.days ? b.total / p.days : 0) + ' a day';
    }

    var tbl = el('table', { class: 'grid', style: { minWidth: '0' } });
    var tb = el('tbody');
    t.categories.forEach(function (c, i) {
      var input = el('input', {
        type: 'number', class: 'cell-in', min: '0', step: '100',
        value: String(Number(p.budget[c.id]) || 0),
        oninput: function () {
          p.budget[c.id] = Math.max(0, Number(input.value) || 0);
          recalc(); saveSoon();
        }
      });
      tb.appendChild(el('tr', {}, [
        el('td', {}, [
          el('span', { class: 'dot', style: { background: DD.charts.colourFor(c.id, i),
            display: 'inline-block', marginRight: '8px' } }),
          c.label
        ]),
        el('td', { style: { width: '132px' } }, [input])
      ]));
    });
    tbl.appendChild(tb);

    host.appendChild(el('div', { style: { display: 'flex', gap: '12px', alignItems: 'baseline',
      marginBottom: '12px', flexWrap: 'wrap' } }, [
      el('span', { class: 'lbl-cap', style: { margin: 0 }, text: 'Total' }), totalNode, perDayNode
    ]));
    host.appendChild(el('div', { class: 'tbl-wrap' }, [tbl]));

    var daysIn = el('input', { type: 'number', min: '1', value: String(p.days),
      oninput: function () { p.days = Math.max(1, Number(daysIn.value) || 1); recalc(); saveSoon(); } });
    host.appendChild(el('div', { class: 'grid2', style: { marginTop: '14px' } }, [
      DD.field('Days here', daysIn),
      DD.field('Local currency', currencySelect(p.currency,
        function (v) { p.currency = v; S.save(); }))
    ]));

    var st = S.placeState(t, p);
    if (st.count) {
      host.appendChild(el('div', { class: st.state === 'over' ? 'banner' : 'banner info',
        style: { marginTop: '14px' } }, [
        el('div', {}, [
          el('strong', { text: DD.money(st.spent) + ' spent here. ' }),
          st.spent > st.budget
            ? DD.money(st.spent - st.budget) + ' over budget.'
            : DD.money(st.budget - st.spent) + ' still in hand.'
        ])
      ]));
    }
    recalc();
  }

  /* ----- spending ----- */
  function spendPane(t, p, host) {
    var st = S.placeState(t, p);
    host.appendChild(DD.statStrip([
      DD.stat('Budget', DD.money(st.budget), ''),
      DD.stat('Spent', DD.money(st.spent), DD.plural(st.count, 'entry', 'entries')),
      DD.stat(st.spent > st.budget ? 'Over' : 'Left', DD.money(Math.abs(st.budget - st.spent)), '',
        st.spent > st.budget ? 'neg' : 'pos')
    ]));

    var pB = S.placeBudget(t, p);
    /* placeState() carries totals only; the per-category split comes from
       actuals(). Reading st.byCat gave undefined the moment a place had
       spending, which the Log tab now shows straight away. */
    var act = S.actuals(t, p.id);
    var colours = DD.charts.distinctColours(t.categories.map(function (c) { return c.id; }));
    if (pB.total > 0) {
      var pChartMode = act.total > 0 ? 'spent' : 'budget';
      var pChartWrap = el('div', { class: 'card card-pad', style: { margin: '20px 0' } });
      var placeCharts = el('div', { style: { display: 'flex', gap: '24px', alignItems: 'center', flexWrap: 'wrap' } });
      
      var paintPlace = function(which) {
        DD.clear(placeCharts);
        var src = which === 'spent' ? act.byCat : p.budget;
        var totalVal = which === 'spent' ? act.total : pB.total;
        var placeData = t.categories.map(function(c) {
          return { id: c.id, label: c.label, value: (src && src[c.id]) || 0, colour: colours[c.id] };
        }).filter(function(d) { return d.value > 0; }).sort(DD.by('value', 'desc'));

        var pDonut = DD.charts.donut(placeData, {
          centre: DD.money(totalVal, { compact: true }),
          centreSub: which === 'spent' ? 'spent' : 'budget'
        });
        placeCharts.appendChild(el('div', { class: 'chart-side' }, [
          pDonut, DD.charts.legend(placeData, pDonut)
        ]));

        var pBarsData = t.categories.map(function(c) {
          return { id: c.id, label: c.label, budget: p.budget[c.id] || 0, actual: act.byCat[c.id] || 0 };
        }).filter(function(r) { return r.budget > 0 || r.actual > 0; }).sort(DD.by('budget', 'desc'));

        var pDetailsCol = el('div', { style: { flex: '1 1 260px', minWidth: '0' } });
        pDetailsCol.appendChild(DD.charts.verticalCompareBars(pBarsData, { colours: colours }));
        placeCharts.appendChild(pDetailsCol);
      };
      
      paintPlace(pChartMode);
      if (st.spent > 0) {
        DD.append(pChartWrap, el('div', { style: { marginBottom: '14px' } }, [
          DD.segmented([['budget', 'Budget'], ['spent', 'Spent']], pChartMode, paintPlace)
        ]));
      }
      pChartWrap.appendChild(placeCharts);
      host.appendChild(pChartWrap);
    }
    host.appendChild(el('div', { style: { margin: '14px 0' } }, [
      el('button', { class: 'btn pri block', onclick: function () {
        DD.logForm({ trip: t, placeId: p.id, after: function () { spendRefresh(t, p, host); } });
      } }, [icon('plus', 15), 'Log spend in ' + p.name])
    ]));
    host.appendChild(DD.expenseLedger(t, { placeId: p.id }));
  }

  function spendRefresh(t, p, host) {
    DD.clear(host);
    spendPane(t, p, host);
  }

  /* ----- road map ----- */
  function mapPane(t, p, host) {
    var where = [p.city, p.country !== p.name ? p.country : null, p.name]
      .filter(function (v, i, a) { return v && a.indexOf(v) === i; }).join(', ');

    host.appendChild(el('p', { class: 'deck', style: { marginTop: 0 } },
      'Streets around ' + (p.city || p.name) + '. Drag to move, scroll to zoom.'));

    if (typeof p.lat === 'number' && typeof p.lon === 'number') {
      host.appendChild(DD.map.road(p, { height: 340, zoom: t.kind === 'domestic' ? 11 : 10 }));
    } else {
      host.appendChild(el('div', { class: 'banner' }, [
        el('div', {}, ['No coordinates for ' + p.name + ' yet, so there is nothing to centre on. '
          + 'Find a photo under Photos and they are filled in for you, or type them under Details.'])
      ]));
    }

    host.appendChild(el('div', { class: 'chip-row', style: { marginTop: '13px' } }, [
      el('a', { class: 'btn sm pri', href: DD.map.googleUrl(p), target: '_blank', rel: 'noopener' },
        [icon('map', 14), 'Open in Google Maps']),
      el('a', { class: 'btn sm', href: DD.map.directionsUrl(p), target: '_blank', rel: 'noopener' },
        [icon('route', 14), 'Directions']),
      el('a', { class: 'btn sm', target: '_blank', rel: 'noopener',

    ]));

  /* ----- photos ----- */
  function photosPane(t, p, host) {
    var gal = el('div', { class: 'gal', style: { marginBottom: '14px' } });

    function paintGal() {
      DD.clear(gal);
      if (!p.images.length) {
        gal.appendChild(el('div', { class: 'muted small', style: { gridColumn: '1/-1' }, text: 'No photos yet.' }));
        return;
      }
      p.images.forEach(function (im, i) {
        gal.appendChild(el('figure', {}, [
          el('img', { src: im.url, alt: im.credit || p.name, loading: 'lazy',
            onerror: function () { this.parentNode.style.display = 'none'; } }),
          el('figcaption', { text: im.credit || '' }),
          el('button', { class: 'x', html: '&times;', title: 'Remove',
            onclick: function () { p.images.splice(i, 1); S.save(); paintGal(); } })
        ]));
      });
    }
    paintGal();
    host.appendChild(gal);

    var urlIn = el('input', { type: 'url', placeholder: 'https://…  paste any image link' });
    host.appendChild(el('div', { class: 'row', style: { marginBottom: '14px' } }, [
      urlIn,
      el('button', { class: 'btn', style: { flex: '0 0 auto' }, text: 'Add', onclick: function () {
        var u = urlIn.value.trim();
        if (!u) return;
        p.images.push({ url: u, credit: 'Added by you', source: '' });
        S.save(); urlIn.value = ''; paintGal();
      } })
    ]));

    var status = el('div', { class: 'muted small' });
    host.appendChild(el('div', { style: { display: 'flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap' } }, [
      el('button', { class: 'btn', onclick: fetchMore }, [icon('image', 14), 'Find photos of ' + (p.city || p.name)]),
      status
    ]));
    host.appendChild(el('p', { class: 'tiny muted', style: { marginTop: '11px', marginBottom: 0 } },
      DD.images.needsServer()
        ? 'Photo search needs an http:// origin — run python3 serve.py and open http://localhost:4190/. Pasting a URL works either way.'
        : 'Photos come from Wikipedia and Wikimedia Commons — freely licensed, credited above, stored as links.'));

    function fetchMore() {
      if (DD.images.needsServer()) {
        status.textContent = 'Opened from disk — run serve.py to search, or paste a URL above.';
        return;
      }
      if (!DD.images.online()) { status.textContent = 'You are offline.'; return; }
      p.noPhoto = false;
      DD.clear(status);
      status.appendChild(el('span', { class: 'spin' }));
      status.appendChild(document.createTextNode(' searching…'));
      var q = DD.images.queryFor(p);
      DD.images.search(q, 8).then(function (found) {
        var have = {};
        p.images.forEach(function (im) { have[im.url] = 1; });
        var added = 0;
        found.forEach(function (im) { if (!have[im.url]) { p.images.push(im); added++; } });
        if (added) { S.save(); paintGal(); }
        status.textContent = added ? added + ' added' : 'Nothing new found for "' + q + '"';
      }).catch(function () { status.textContent = 'Could not reach Wikimedia.'; });
    }
  }

  /* ----- plan ----- */
  function planPane(t, p, host) {

    function paint() {
      DD.clear(list);

      if (!items.length) {
        list.appendChild(el('div', { class: 'empty', style: { padding: '26px 18px' } }, [

        ]));

          ]),

/* ===== 25-cities.js ===== */
/* 25-cities — every city on a trip at home, read back out of the day-by-day
   itinerary. The India sheet budgets by state, so a state is the unit that
   carries money; this is the page that answers "which towns, and when?". */
'use strict';

(function () {
  var el = DD.el, S = DD.store;
  var query = '';

  DD.register('cities', {
    title: 'Cities',
    render: render
  });

  /* Flatten every place's itinerary into one list of city-days. */
  function cityDays(t) {
    var sched = S.schedule(t);
    var out = [];
    S.places(t).forEach(function (p) {
      (p.itinerary || []).slice().sort(DD.by('day')).forEach(function (it) {
        var s = sched[p.id];
        out.push({
          place: p, it: it,
          date: s && s.start ? DD.addDays(s.start, Math.max(0, (it.day || 1) - 1)) : ''
        });
      });
    });
    return out;
  }

  function render(host) {
    var t = S.trip();

    if (t.kind !== 'domestic') {
      host.appendChild(DD.emptyState('Cities live on trips at home',
        'This page reads the day-by-day cities out of a domestic trip. Switch to one to see it.',
        'Go to the front page', function () { DD.go('front'); }));
      return;
    }

    DD.append(host, DD.placesViewToggle('cities'));

    var all = cityDays(t);
    if (!all.length) {
      host.appendChild(DD.emptyState('No cities yet',
        'Add a state on the States page, then list its towns day by day under Plan.',
        'Open ' + DD.placesLabel(), function () { DD.go('places'); }));
      return;
    }

    /* one entry per distinct city name, so repeats across days collapse */
    var distinct = {};
    all.forEach(function (r) { distinct[r.it.title] = 1; });
    var done = all.filter(function (r) { return r.it.done; }).length;

    host.appendChild(el('p', { class: 'lede' },
      'The route runs through ' + DD.plural(Object.keys(distinct).length, 'town') + ' across '
      + DD.plural(S.places(t).length, 'state') + ' — ' + DD.plural(all.length, 'day')
      + ' in all. Tick them off as you go.'));

    host.appendChild(DD.statStrip([
      DD.stat('Towns', String(Object.keys(distinct).length), 'distinct stops', 'hero'),
      DD.stat('City-days', String(all.length), DD.plural(done, 'ticked off')),
      DD.stat('States', String(S.places(t).length), 'each with its own budget'),
      DD.stat('Budget', DD.money(S.tripBudget(t).total, { compact: true }), 'across the whole route')
    ]));

    var search = el('input', {
      type: 'text', placeholder: 'Find a town, a state, or something to do…', value: query,
      oninput: DD.debounce(function () { query = search.value; paint(); }, 180)
    });
    host.appendChild(DD.sectionHead(t.name, 'Town by town',
      el('span', { class: 'chip', text: DD.plural(all.length, 'day') })));
    host.appendChild(el('div', { style: { marginBottom: '14px' } }, [search]));

    var body = el('div', {});
    host.appendChild(body);

    function paint() {
      DD.clear(body);
      var q = query.trim().toLowerCase();
      var shown = 0;

      S.places(t).forEach(function (p) {
        var rows = (p.itinerary || []).slice().sort(DD.by('day')).filter(function (it) {
          if (!q) return true;
          return (it.title + ' ' + (it.note || '') + ' ' + p.name).toLowerCase().indexOf(q) >= 0;
        });
        if (!rows.length) return;
        shown += rows.length;

        var st = S.placeState(t, p);
        var sched = S.schedule(t)[p.id];
        var card = el('div', { class: 'card', style: { marginBottom: '14px', overflow: 'hidden' } });

        card.appendChild(el('div', { class: 'day-head', style: { borderTop: 0 } }, [
          el('span', { text: p.name }),
          el('span', { class: 'muted', style: { fontWeight: '400', textTransform: 'none', letterSpacing: '0' },
            text: DD.plural(rows.length, 'day') + (sched && sched.start
              ? ' · ' + DD.shortDate(sched.start) + '–' + DD.shortDate(sched.end) : '') }),
          el('span', { class: 'spacer' }),
          el('span', { class: 'num', style: { textTransform: 'none' },
            text: DD.money(st.budget, { compact: true }) }),
          el('button', { class: 'btn xs', onclick: function () { DD.placeEditor(t, p); } }, 'Open')
        ]));

        rows.forEach(function (it) {
          var date = sched && sched.start ? DD.addDays(sched.start, Math.max(0, (it.day || 1) - 1)) : '';
          card.appendChild(el('div', { class: 'list-row city-row' }, [
            el('label', { class: 'inline-check', style: { margin: 0 } }, [
              el('input', { type: 'checkbox', checked: !!it.done,
                onchange: function () { it.done = this.checked; S.save(); paint(); } })
            ]),
            el('span', { class: 'day', text: String(it.day) }),
            el('div', { class: 'grow' }, [
              el('div', { class: 't', style: it.done
                ? { textDecoration: 'line-through', color: 'var(--ink-3)' } : {}, text: it.title }),
              it.note ? el('div', { class: 'city-note', text: it.note }) : null,
              date ? el('div', { class: 's', text: DD.niceDate(date, true) }) : null
            ]),
            el('button', { class: 'btn xs', onclick: function () {
              DD.logForm({ trip: t, placeId: p.id, note: it.title });
            } }, 'Log')
          ]));
        });
        body.appendChild(card);
      });

      if (!shown) {
        body.appendChild(el('div', { class: 'card empty' }, [
          el('p', { style: { margin: 0 }, text: 'Nothing matches “' + query + '”.' })
        ]));
      }
    }
    paint();
  }

  DD.cityDays = cityDays;
})();


/* ===== 30-sheet.js ===== */
/* 30-sheet — the spreadsheet view: places down, categories across. */
'use strict';

(function () {
  var el = DD.el, S = DD.store;
  var mode = 'budget';   /* budget | actual | variance */

  DD.register('sheet', {
    title: 'Budget vs actual',
    wide: true,
    render: render
  });

  /* The mode switch lives in the page, not the topbar: on a phone it is wide
     enough to squeeze the title out of existence. */
  function toolbar() {
    return el('div', {
      style: { display: 'flex', gap: '9px', alignItems: 'center', flexWrap: 'wrap', marginBottom: '13px' }
    }, [
      DD.segmented([['budget', 'Budget'], ['actual', 'Actual'], ['variance', 'Variance']], mode, function (v) {
        mode = v; DD.render();
      }),
      el('div', { style: { flex: '1' } }),
      el('button', { class: 'btn sm', onclick: exportCSV }, [DD.icon('down', 15), 'CSV'])
    ]);
  }

  function valueFor(t, p, catId) {
    var b = S.placeBudget(t, p);
    var a = S.actuals(t, p.id);
    if (mode === 'budget') return b.byCat[catId];
    if (mode === 'actual') return a.byCat[catId] || 0;
    return (a.byCat[catId] || 0) - b.byCat[catId];
  }

  function render(host) {
    var t = S.trip();
    var list = S.places(t);
    DD.append(host, DD.tripSwitcher());
    host.appendChild(el('p', { class: 'deck' },
      'Every figure in rupees. Budget cells are typed in; actual and variance are worked out from the ledger.'));
    host.appendChild(toolbar());
    if (!list.length) {
      host.appendChild(DD.emptyState('Nothing to tabulate', 'Add a place and its budget shows up here.', 'Add a place', function () { DD.go('places'); }));
      return;
    }

    if (mode === 'budget') {
      host.appendChild(el('div', { class: 'banner info' }, [
        el('div', {}, ['Type straight into any cell to change the budget. ',
          el('strong', { text: 'Actual' }), ' and ', el('strong', { text: 'Variance' }),
          ' are worked out from what you log and cannot be typed over.'])
      ]));
    }

    var table = el('table', { class: 'grid' });

    /* head */
    var hr = el('tr', {}, [el('th', { text: t.kind === 'domestic' ? 'State' : 'Country' }), el('th', { text: 'Days' })]);
    t.categories.forEach(function (c) { hr.appendChild(el('th', { text: c.label })); });
    hr.appendChild(el('th', { text: 'Total' }));
    hr.appendChild(el('th', { text: 'Per day' }));
    if (mode === 'budget') hr.appendChild(el('th', { text: 'Running' }));
    table.appendChild(el('thead', {}, [hr]));

    /* body */
    var tb = el('tbody');
    var running = 0;
    var colTotals = {};
    t.categories.forEach(function (c) { colTotals[c.id] = 0; });
    var grand = 0, grandDays = 0;

    list.forEach(function (p) {
      var tr = el('tr', {});
      tr.appendChild(el('td', { title: p.name }, [
        p.iso2 ? el('span', { style: { marginRight: '6px' }, text: DD.flagOf(p.iso2) }) : null,
        el('button', {
          style: { border: 0, background: 'none', padding: 0, cursor: 'pointer', font: 'inherit', color: 'inherit', textDecoration: 'underline', textDecorationColor: 'var(--rule)' },
          text: p.name, onclick: function () { DD.placeEditor(t, p); }
        })
      ]));
      tr.appendChild(el('td', { class: 'n' }, String(p.days)));

      var rowTotal = 0;
      t.categories.forEach(function (c) {
        var v = valueFor(t, p, c.id);
        rowTotal += v;
        colTotals[c.id] += v;
        if (mode === 'budget') {
          var input = el('input', {
            type: 'number', class: 'cell-in', min: '0', step: '100',
            value: String(Math.round(v)),
            onchange: function () {
              p.budget[c.id] = Math.max(0, Number(input.value) || 0);
              S.save();
              DD.render();
            }
          });
          tr.appendChild(el('td', { style: { minWidth: '106px' } }, [input]));
        } else {
          var cls = 'n' + (v === 0 ? ' zero' : '') + (mode === 'variance' ? (v > 0 ? ' over' : (v < 0 ? ' under' : '')) : '');
          tr.appendChild(el('td', { class: cls }, fmt(v)));
        }
      });

      grand += rowTotal;
      grandDays += Number(p.days) || 0;
      tr.appendChild(el('td', { class: 'n' + (mode === 'variance' ? (rowTotal > 0 ? ' over' : (rowTotal < 0 ? ' under' : '')) : ''), style: { fontWeight: '650' } }, fmt(rowTotal)));
      tr.appendChild(el('td', { class: 'n muted' }, fmt(p.days ? rowTotal / p.days : 0)));
      if (mode === 'budget') {
        running += rowTotal;
        tr.appendChild(el('td', { class: 'n muted' }, DD.money(running, { compact: true })));
      }
      tb.appendChild(tr);
    });
    table.appendChild(tb);

    /* foot */
    var fr = el('tr', {}, [el('td', { text: 'All ' + list.length }), el('td', { class: 'n' }, String(grandDays))]);
    t.categories.forEach(function (c) {
      fr.appendChild(el('td', { class: 'n' + (mode === 'variance' ? (colTotals[c.id] > 0 ? ' over' : (colTotals[c.id] < 0 ? ' under' : '')) : '') }, fmt(colTotals[c.id])));
    });
    fr.appendChild(el('td', { class: 'n' }, fmt(grand)));
    fr.appendChild(el('td', { class: 'n' }, fmt(grandDays ? grand / grandDays : 0)));
    if (mode === 'budget') fr.appendChild(el('td', { class: 'n' }, DD.money(grand, { compact: true })));
    table.appendChild(el('tfoot', {}, [fr]));

    host.appendChild(el('div', { class: 'tbl-wrap' }, [table]));

    /* summary strip */
    var b = S.tripBudget(t), a = S.actuals(t);
    host.appendChild(el('div', { style: { marginTop: '18px' } }, [DD.statStrip([
      DD.stat('Budget', DD.money(b.total), DD.money(b.days ? b.total / b.days : 0) + ' a day', 'hero'),
      DD.stat('Actual', DD.money(a.total), DD.plural(a.count, 'entry', 'entries')),
      DD.stat(a.total > b.total ? 'Over by' : 'Under by', DD.money(Math.abs(a.total - b.total)),
        DD.pct(a.total, b.total) + '% of budget used', a.total > b.total ? 'neg' : 'pos'),
      DD.stat('Places', String(list.length), DD.plural(b.days, 'day'))
    ])]));

  }

  function fmt(v) {
    if (!v) return '—';
    var s = DD.groupIN(Math.abs(Math.round(v)));
    return (v < 0 ? '−' : '') + s;
  }

  function exportCSV() {
    var t = S.trip();
    var rows = [];
    rows.push([t.name + ' — ' + mode, 'all figures in INR']);
    rows.push([]);
    var head = [t.kind === 'domestic' ? 'State' : 'Country', 'Main city', 'Currency', 'Days'];
    t.categories.forEach(function (c) { head.push(c.label); });
    head.push('Total', 'Per day');
    rows.push(head);
    S.places(t).forEach(function (p) {
      var r = [p.name, p.city || '', p.currency, p.days];
      var tot = 0;
      t.categories.forEach(function (c) { var v = valueFor(t, p, c.id); tot += v; r.push(Math.round(v)); });
      r.push(Math.round(tot), Math.round(p.days ? tot / p.days : 0));
      rows.push(r);
    });
    DD.downloadFile(DD.slug(t.name) + '-' + mode + '-' + DD.today() + '.csv', DD.csvOf(rows), 'text/csv;charset=utf-8');
    DD.toast('CSV downloaded');
  }
})();


/* ===== 40-log.js ===== */
/* 40-log — logging spend. There is no Log section any more: expenses belong to
   a trip, and you reach them from a place or from the trip's own ledger. */
'use strict';

(function () {
  var el = DD.el, S = DD.store;

  /* ------------------------------------------------------------ the row */
  function expenseRow(t, x, opts) {
    opts = opts || {};
    var p = S.placeById(t, x.placeId);
    return el('div', {
      class: 'list-row', style: { cursor: 'pointer' },
      onclick: function () { form({ trip: t, expense: x }); }
    }, [
      el('span', { class: 'dot', style: { background: DD.charts.colourFor(x.category, 0) },
        title: S.catLabel(t, x.category) }),
      el('div', { class: 'grow' }, [
        el('div', { class: 't', text: x.note || S.catLabel(t, x.category) }),
        el('div', { class: 's', text: [
          DD.shortDate(x.date),
          S.catLabel(t, x.category),
          p ? p.name : null,
          opts.showTrip ? t.name : null,
          x.currency !== 'INR' ? DD.fmtLocal(x.amount, x.currency) : null
        ].filter(Boolean).join('  ·  ') })
      ]),
      el('span', { class: 'amt', text: DD.money(x.amountINR) })
    ]);
  }

  /* ------------------------------------------------- a trip's whole ledger */
  function ledger(t, opts) {
    opts = opts || {};
    var wrap = el('div', {});
    var rows = t.expenses.slice();
    if (opts.placeId) rows = rows.filter(function (x) { return x.placeId === opts.placeId; });
    rows.sort(DD.by('date', 'desc'));

    if (!rows.length) {
      wrap.appendChild(el('div', { class: 'card empty', style: { padding: '30px 20px' } }, [
        el('p', { style: { margin: '0 0 14px' }, text: opts.placeId
          ? 'Nothing logged here yet.'
          : 'Nothing logged on this trip yet. Every entry feeds the sheet, the map and the totals.' }),
        el('button', { class: 'btn pri sm', onclick: function () {
          form({ trip: t, placeId: opts.placeId });
        } }, [DD.icon('plus', 14), 'Log the first one'])
      ]));
      return wrap;
    }

    var card = el('div', { class: 'card', style: { overflow: 'hidden' } });
    var last = null;
    rows.forEach(function (x) {
      if (x.date !== last) {
        last = x.date;
        var dayTotal = DD.sum(rows.filter(function (o) { return o.date === x.date; }),
          function (o) { return o.amountINR; });
        card.appendChild(el('div', { class: 'day-head' }, [
          el('span', { text: DD.niceDate(x.date, true) }),
          el('span', { class: 'spacer' }),
          el('span', { class: 'num', text: DD.money(dayTotal) })
        ]));
      }
      card.appendChild(expenseRow(t, x));
    });
    wrap.appendChild(card);

    if (!opts.placeId) {
      wrap.appendChild(el('div', { style: { marginTop: '12px', display: 'flex', gap: '9px', flexWrap: 'wrap' } }, [
        el('button', { class: 'btn sm', onclick: function () { exportCSV(t); } }, [DD.icon('down', 14), 'Export to CSV'])
      ]));
    }
    return wrap;
  }

  /* --------------------------------------------------------------- form */
  function form(opts) {
    opts = opts || {};
    var t = opts.trip || S.trip();
    var x = opts.expense || null;

    if (!t.places.length) {
      DD.toast('Add a place first — expenses hang off one', true);
      return null;
    }

    var startPlace = x ? x.placeId : (opts.placeId || (S.places(t)[0] || {}).id || '');
    var place = S.placeById(t, startPlace);

    var amountIn = el('input', { type: 'number', step: '0.01', min: '0', inputmode: 'decimal',
      placeholder: '0', value: x ? String(x.amount) : '' });
    var curSel = DD.selectOf(currencyShortlist(place), x ? x.currency : (place ? place.currency : 'INR'),
      function () { preview(); });
    var placeSel = DD.selectOf(S.places(t).map(function (p) { return [p.id, p.name]; }), startPlace, function (v) {
      var np = S.placeById(t, v);
      if (np && !x) curSel.value = np.currency;
      preview();
    });
    var catSel = DD.selectOf(t.categories.map(function (c) { return [c.id, c.label]; }), x ? x.category : 'food');
    var dateIn = el('input', { type: 'date', value: x ? x.date : DD.today() });
    var noteIn = el('input', { type: 'text', placeholder: 'What was it?',
      value: x ? x.note : (opts.note || '') });
    var conv = el('div', { class: 'tiny muted sans',
      style: { marginTop: '-9px', marginBottom: '14px', minHeight: '17px', letterSpacing: '.03em' } });

    function preview() {
      var code = curSel.value, amt = Number(amountIn.value) || 0;
      if (!amt) { conv.textContent = ''; return; }
      if (code === 'INR') { conv.textContent = DD.money(amt); return; }
      var rate = DD.rateFor(code, S.db().currencies);
      conv.textContent = DD.num(amt, 2) + ' ' + code + '  =  ' + DD.money(amt / rate)
        + '   (1 ₹ = ' + DD.num(rate, rate < 1 ? 4 : 2) + ' ' + code + ')';
    }
    amountIn.addEventListener('input', preview);
    preview();

    var body = el('div', {}, [
      el('div', { class: 'row' }, [
        el('label', { class: 'field', style: { flex: '2' } }, [el('span', { text: 'Amount' }), amountIn]),
        el('label', { class: 'field', style: { flex: '1' } }, [el('span', { text: 'Currency' }), curSel])
      ]),
      conv,
      el('div', { class: 'grid2' }, [
        DD.field('Category', catSel),
        DD.field(t.kind === 'domestic' ? 'State' : 'Country', placeSel)
      ]),
      el('div', { class: 'grid2' }, [
        DD.field('Date', dateIn),
        DD.field('Note', noteIn)
      ])
    ]);

    var m = DD.modal({
      title: x ? 'Edit entry' : 'Log spend · ' + t.name,
      body: body,
      okLabel: x ? 'Save' : 'Add',
      destructive: x ? {
        label: 'Delete', run: function (close) {
          close(); S.removeExpense(t, x.id); DD.render(); DD.toast('Entry deleted');
        }
      } : null,
      ok: function (close) {
        var amt = Number(amountIn.value);
        if (!amt || amt <= 0) { amountIn.focus(); DD.toast('Enter an amount', true); return; }
        var rec = {
          placeId: placeSel.value, date: dateIn.value || DD.today(),
          category: catSel.value, amount: amt, currency: curSel.value,
          note: noteIn.value.trim()
        };
        if (x) S.updateExpense(t, x.id, rec);
        else S.addExpense(t, rec);
        close();
        DD.render();
        if (opts.after) opts.after();
        DD.toast(x ? 'Saved' : DD.money(amt / DD.rateFor(rec.currency, S.db().currencies)) + ' logged');
      }
    });

    setTimeout(function () { amountIn.focus(); }, 60);
    return m;
  }

  /* The place's own currency first, then rupees, then the rest. */
  function currencyShortlist(place) {
    var cur = S.db().currencies;
    var first = [];
    if (place && place.currency && place.currency !== 'INR') first.push(place.currency);
    first.push('INR');
    var rest = Object.keys(cur).filter(function (c) { return first.indexOf(c) < 0; }).sort();
    return first.concat(rest).map(function (c) { return [c, c + ' — ' + cur[c].name]; });
  }

  function exportCSV(t) {
    var rows = [['Date', 'Place', 'Category', 'Amount', 'Currency', 'INR', 'Note']];
    t.expenses.slice().sort(DD.by('date')).forEach(function (x) {
      var p = S.placeById(t, x.placeId);
      rows.push([x.date, p ? p.name : '', S.catLabel(t, x.category), x.amount, x.currency,
        Math.round(x.amountINR), x.note || '']);
    });
    DD.downloadFile(DD.slug(t.name) + '-spending-' + DD.today() + '.csv', DD.csvOf(rows), 'text/csv;charset=utf-8');
    DD.toast('CSV downloaded');
  }

  DD.expenseRow = expenseRow;
  DD.expenseLedger = ledger;
  DD.logForm = form;
})();


/* ===== 60-itinerary.js ===== */
/* 60-itinerary — the whole trip, day by day. */
'use strict';

(function () {
  var el = DD.el, S = DD.store;

  DD.register('itinerary', {
    title: 'Itinerary',
    actions: function () {
      return [el('button', { class: 'btn sm', onclick: setDates }, [DD.icon('cal', 15), 'Trip dates'])];
    },
    render: render
  });

  function render(host) {
    var t = S.trip();
    var list = S.places(t);
    DD.append(host, DD.tripSwitcher());

    if (!list.length) {
      host.appendChild(DD.emptyState('No route yet',
        'Add places and set how many days you spend in each. The itinerary lays itself out from there.',
        'Add a place', function () { DD.go('places'); }));
      return;
    }

    var sched = S.schedule(t);
    var totalDays = DD.sum(list, function (p) { return Number(p.days) || 0; });
    var planned = DD.sum(list, function (p) { return (p.itinerary || []).length; });
    var done = DD.sum(list, function (p) { return (p.itinerary || []).filter(function (i) { return i.done; }).length; });

    host.appendChild(DD.statStrip([
      DD.stat('Stops', String(list.length), t.kind === 'domestic' ? 'states' : 'countries', 'hero'),
      DD.stat('Days', String(totalDays), t.start ? DD.dateSpan(t.start, S.tripEnd(t)) : 'no start date set'),
      DD.stat('Planned', String(planned), done + ' ticked off'),
      DD.stat('Planned cost', DD.money(DD.sum(list, function (p) {
        return DD.sum(p.itinerary || [], function (i) { return Number(i.cost) || 0; });
      })), 'from the plan items')
    ]));

    if (!t.start) {
      host.appendChild(el('div', { class: 'banner' }, [
        el('div', {}, ['No start date, so the plan shows relative days. ',
          el('button', { class: 'btn xs', text: 'Set a start date', onclick: setDates })])
      ]));
    }

    list.forEach(function (p) {
      var s = sched[p.id] || {};
      var st = S.placeState(t, p);

      var head = el('div', { class: 'day-head', style: { borderRadius: 'var(--r-lg) var(--r-lg) 0 0' } }, [
        p.iso2 ? el('span', { text: DD.flagOf(p.iso2), style: { fontSize: '15px' } }) : null,
        el('span', { style: { fontSize: '14px' }, text: p.name }),
        el('span', { class: 'muted', style: { fontWeight: '400' },
          text: s.start ? DD.shortDate(s.start) + ' – ' + DD.shortDate(s.end) : DD.plural(p.days, 'day') }),
        el('span', { class: 'spacer' }),
        el('span', { class: 'num tiny muted', text: DD.money(st.spent, { compact: true }) + ' / ' + DD.money(st.budget, { compact: true }) }),
        el('button', { class: 'btn xs', text: 'Edit', onclick: function () { DD.placeEditor(t, p); } })
      ]);

      var card = el('div', { class: 'card', style: { marginBottom: '13px', overflow: 'hidden' } }, [head]);
      var items = (p.itinerary || []).slice().sort(DD.by('day'));

      if (!items.length) {
        card.appendChild(el('div', { style: { padding: '15px 16px' } }, [
          el('span', { class: 'muted small', text: 'Nothing planned. ' }),
          el('button', { class: 'btn xs', text: 'Add something', onclick: function () { DD.placeEditor(t, p); } })
        ]));
      } else {
        var lastDay = null;
        items.forEach(function (it) {
          if (it.day !== lastDay) {
            lastDay = it.day;
            var date = s.start ? DD.addDays(s.start, Math.max(0, it.day - 1)) : '';
            card.appendChild(el('div', {
              style: { padding: '7px 16px', background: '#FBFCFB', borderTop: '1px solid var(--rule-2)',
                       fontSize: '12px', fontWeight: '650', color: 'var(--ink-3)', letterSpacing: '.05em', textTransform: 'uppercase' },
              text: 'Day ' + it.day + (date ? '  ·  ' + DD.niceDate(date) : '')
            }));
          }
          card.appendChild(el('div', { class: 'list-row' }, [
            el('label', { class: 'inline-check', style: { margin: 0 } }, [
              el('input', { type: 'checkbox', checked: !!it.done, onchange: function () { it.done = this.checked; S.save(); DD.render(); } })
            ]),
            el('div', { class: 'grow' }, [
              el('div', { class: 't', text: it.title, style: it.done ? { textDecoration: 'line-through', color: 'var(--ink-3)' } : {} }),
              it.note ? el('div', { class: 's', text: it.note }) : null
            ]),
            it.cost ? el('span', { class: 'amt small', text: DD.money(it.cost) }) : null
          ]));
        });
      }
      host.appendChild(card);
    });
  }

  function setDates() {
    var t = S.trip();
    var startIn = el('input', { type: 'date', value: t.start || '' });
    var noteIn = el('input', { type: 'text', value: t.note || '', placeholder: 'Optional note about the trip' });
    var preview = el('p', { class: 'small muted', style: { margin: '0' } });

    function paint() {
      var total = DD.sum(t.places, function (p) { return Number(p.days) || 0; });
      if (!startIn.value) { preview.textContent = 'Without a date the plan just counts days.'; return; }
      preview.textContent = DD.plural(total, 'day') + ' across ' + DD.plural(t.places.length, 'stop')
        + ' — ' + DD.niceDate(startIn.value, true) + ' to ' + DD.niceDate(DD.addDays(startIn.value, Math.max(0, total - 1)), true) + '.';
    }
    startIn.addEventListener('change', paint);
    paint();

    DD.modal({
      title: 'Trip dates',
      body: el('div', {}, [
        DD.field('Start date', startIn),
        DD.field('Note', noteIn),
        preview,
        el('p', { class: 'tiny muted', style: { marginTop: '10px', marginBottom: 0 } },
          'Each place runs straight after the one before it, for however many days you gave it. Reorder places on the Places screen.')
      ]),
      okLabel: 'Save',
      ok: function (close) {
        t.start = startIn.value;
        t.note = noteIn.value.trim();
        S.save(); close(); DD.render();
      }
    });
  }

  DD.tripDates = setDates;
})();


/* ===== 90-data.js ===== */
/* 90-data — backup, the data file, currencies, categories and link templates. */
'use strict';

(function () {
  var el = DD.el, S = DD.store;

  DD.register('data', {
    title: 'Data & settings',
    render: render
  });

  function render(host) {
    var db = S.db();

    /* ------------------------------------------------------ data file */
    host.appendChild(DD.sectionHead('Keeping it', 'Your data'));
    var state = S.fileStatus();
    var fileCard = el('div', { class: 'card card-pad' });

    if (state === 'unsupported') {
      fileCard.appendChild(el('p', {}, [
        'This browser cannot write files in place. Use ',
        el('strong', { text: 'Download data file' }),
        ' below and drop the result into the ', el('code', { text: 'data/' }), ' folder whenever you want to commit. ',
        'Everything is saved in this browser as you work either way.'
      ]));
    } else if (state === 'none') {
      fileCard.appendChild(el('p', {}, [
        'Your trips live in this browser right now. Connect ', el('code', { text: 'data/trip-data.js' }),
        ' and every change is also written to that file — so it commits, diffs and pulls with the repo.'
      ]));
      fileCard.appendChild(el('button', { class: 'btn pri', onclick: function () {
        S.connectFile().then(function (ok) {
          DD.render();
          DD.toast(ok ? 'Connected — changes now write to the file' : 'Not connected', !ok);
        });
      } }, [DD.icon('link', 16), 'Connect data file']));
    } else {
      fileCard.appendChild(el('div', { style: { display: 'flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap' } }, [
        DD.icon(state === 'saved' ? 'check' : 'edit', 18),
        el('strong', { text: state === 'saved' ? 'Writing to your data file' : 'Unsaved changes to the file' }),
        el('span', { style: { flex: '1' } }),
        state === 'pending' ? el('button', { class: 'btn sm', text: 'Allow writing again', onclick: function () {
          S.regrantFile().then(function (ok) { DD.render(); DD.toast(ok ? 'Saved' : 'Permission refused', !ok); });
        } }) : null,
        el('button', { class: 'btn sm ghost', text: 'Disconnect', onclick: function () {
          S.disconnectFile().then(function () { DD.render(); });
        } })
      ]));
      fileCard.appendChild(el('p', { class: 'small muted', style: { margin: '9px 0 0' } },
        'Browsers sometimes ask again for write access after a restart. If they do, the button above returns.'));
    }

    fileCard.appendChild(el('div', { style: { display: 'flex', gap: '9px', flexWrap: 'wrap', marginTop: '13px' } }, [
      el('button', { class: 'btn sm', onclick: function () {
        DD.downloadFile('trip-data.js', S.fileText(), 'text/javascript;charset=utf-8');
        DD.toast('Downloaded — put it in data/');
      } }, [DD.icon('down', 15), 'Download data file']),
      el('button', { class: 'btn sm', onclick: function () {
        DD.downloadFile('duniya-backup-' + DD.today() + '.json', JSON.stringify(S.db(), null, 2), 'application/json');
        DD.toast('Backup downloaded');
      } }, [DD.icon('down', 15), 'JSON backup']),
      el('button', { class: 'btn sm', onclick: importJSON }, [DD.icon('link', 15), 'Restore from backup']),
      window.DUNIYA_DATA ? el('button', { class: 'btn sm', onclick: reloadFile },
        [DD.icon('down', 15), 'Reload from data/trip-data.js']) : null
    ]));
    host.appendChild(fileCard);

    /* ---------------------------------------------------------- you */
    host.appendChild(DD.sectionHead('Who and where from', 'You'));
    var nameIn = el('input', { type: 'text', value: db.settings.name || '', oninput: DD.debounce(function () {
      db.settings.name = nameIn.value.trim(); S.save();
    }, 400) });
    var homeIn = el('input', { type: 'text', value: db.settings.homeCity || '', maxlength: '40',
      oninput: DD.debounce(function () { db.settings.homeCity = homeIn.value.trim(); S.save(); }, 400) });
    var airIn = el('input', { type: 'text', value: db.settings.homeAirport || '', maxlength: '3',
      style: { textTransform: 'uppercase' },
      oninput: DD.debounce(function () { db.settings.homeAirport = airIn.value.trim().toUpperCase(); S.save(); }, 400) });
    host.appendChild(el('div', { class: 'card card-pad' }, [
      el('div', { class: 'grid3' }, [
        DD.field('Your name', nameIn),
        DD.field('Home city', homeIn),
        DD.field('Home airport', airIn)
      ]),
      el('p', { class: 'tiny muted', style: { margin: 0 } }, 'Your home airport is the departure end of every flight link.')
    ]));

    /* ------------------------------------------------- link templates */
    host.appendChild(DD.sectionHead('Where you book', 'Booking links'));
    host.appendChild(el('p', { class: 'small muted', style: { marginTop: '-6px' } }, [
      'Swap in whichever site you prefer. These tokens get filled in: ',
      el('span', { class: 'chip-row', style: { display: 'inline-flex', verticalAlign: 'middle', marginLeft: '4px' } },
        DD.links.TOKENS.map(function (tk) { return el('span', { class: 'chip grey tiny', text: tk }); }))
    ]));

    var linkCard = el('div', { class: 'card card-pad' });
    [['flights', 'Flights'], ['stays', 'Stays'], ['activities', 'Things to do']].forEach(function (row) {
      var tpl = db.settings.linkTemplates[row[0]];
      var lab = el('input', { type: 'text', value: tpl.label, oninput: DD.debounce(function () {
        tpl.label = lab.value.trim() || row[1]; S.save();
      }, 400) });
      var url = el('input', { type: 'text', value: tpl.url, oninput: DD.debounce(function () {
        tpl.url = url.value.trim(); S.save();
      }, 400) });
      linkCard.appendChild(el('div', { style: { marginBottom: '14px' } }, [
        el('span', { class: 'lbl-cap', text: row[1] }),
        el('div', { class: 'row' }, [
          el('div', { style: { flex: '0 0 150px' } }, [lab]),
          el('div', { style: { flex: '1' } }, [url])
        ])
      ]));
    });
    linkCard.appendChild(el('button', { class: 'btn sm ghost', text: 'Reset to Skyscanner and Booking.com', onclick: function () {
      db.settings.linkTemplates = S.deepClone(window.DUNIYA_SEED.settings.linkTemplates);
      S.save(); DD.render(); DD.toast('Link templates reset');
    } }));
    host.appendChild(linkCard);

    /* ---------------------------------------------------- categories */
    var t = S.trip();
    host.appendChild(DD.sectionHead('Per trip', 'Spending categories'));
    DD.append(host, DD.tripSwitcher());
    host.appendChild(el('p', { class: 'deck', style: { marginTop: '2px' } },
      'These belong to ' + t.name + '. Each trip keeps its own set — the world sheet has eight heads, the India sheet seven.'));
    var catCard = el('div', { class: 'card list' });
    t.categories.forEach(function (c, i) {
      var lab = el('input', { type: 'text', value: c.label, style: { border: '1px solid transparent', background: 'transparent' },
        oninput: DD.debounce(function () { c.label = lab.value.trim() || c.id; S.save(); }, 400) });
      catCard.appendChild(el('div', { class: 'list-row' }, [
        el('span', { class: 'dot', style: { background: DD.charts.colourFor(c.id, i) } }),
        el('div', { class: 'grow' }, [lab]),
        t.categories.length > 2 ? el('button', { class: 'btn xs ghost', html: '&times;', title: 'Remove category', onclick: function () {
          var used = t.expenses.filter(function (x) { return x.category === c.id; }).length;
          DD.confirmBox('Remove ' + c.label + '?',
            used ? DD.plural(used, 'expense') + ' uses it — they keep the amount but lose the label.' : 'It comes off every place in this trip.',
            function () {
              t.categories = t.categories.filter(function (o) { return o.id !== c.id; });
              t.places.forEach(function (p) { delete p.budget[c.id]; });
              S.save(); DD.render();
            }, 'Remove');
        } }) : null
      ]));
    });
    host.appendChild(catCard);
    host.appendChild(el('button', { class: 'btn sm', style: { marginTop: '10px' }, onclick: function () {
      var n = el('input', { type: 'text', placeholder: 'Shopping' });
      DD.modal({ title: 'New category', body: DD.field('Name', n), okLabel: 'Add', ok: function (close) {
        var v = n.value.trim();
        if (!v) return;
        var id = DD.slug(v) || DD.uid('c');
        t.categories.push({ id: id, label: v, shared: false });
        t.places.forEach(function (p) { p.budget[id] = 0; });
        S.save(); close(); DD.render();
      } });
    } }, [DD.icon('plus', 15), 'Add category']));

    /* ---------------------------------------------------- currencies */
    host.appendChild(DD.sectionHead('What a rupee buys', 'Exchange rates'));
    host.appendChild(el('p', { class: 'small muted', style: { marginTop: '-6px' } },
      'How many units of each currency you get for one rupee — the same way your spreadsheet had it. Editing a rate never changes an expense you already logged; each entry keeps the rate it was booked at.'));

    var curWrap = el('div', { class: 'card', style: { overflow: 'hidden' } });
    var search = el('input', { type: 'text', placeholder: 'Find a currency', style: { border: 0, borderRadius: 0, borderBottom: '1px solid var(--rule-2)' } });
    curWrap.appendChild(search);
    var curList = el('div', { class: 'list', style: { maxHeight: '380px', overflowY: 'auto' } });
    curWrap.appendChild(curList);

    function paintCur() {
      DD.clear(curList);
      var q = search.value.trim().toLowerCase();
      var codes = Object.keys(db.currencies).sort().filter(function (code) {
        return !q || code.toLowerCase().indexOf(q) >= 0 || db.currencies[code].name.toLowerCase().indexOf(q) >= 0;
      });
      codes.forEach(function (code) {
        var c = db.currencies[code];
        var inp = el('input', {
          type: 'number', step: 'any', min: '0', class: 'cell-in', value: String(c.perINR),
          style: { textAlign: 'right', border: '1px solid var(--rule)', maxWidth: '130px' },
          onchange: function () {
            var v = Number(inp.value);
            if (v > 0) { c.perINR = v; S.save(); DD.toast(code + ' rate updated'); }
            else inp.value = String(c.perINR);
          }
        });
        curList.appendChild(el('div', { class: 'list-row' }, [
          el('div', { class: 'grow' }, [
            el('div', { class: 't', text: code }),
            el('div', { class: 's', text: c.name + '  ·  1 ' + code + ' = ' + DD.money(1 / c.perINR) })
          ]),
          el('span', { class: 'tiny muted nowrap', text: 'per ₹1' }),
          inp
        ]));
      });
      if (!codes.length) curList.appendChild(el('div', { class: 'empty', style: { padding: '22px' } }, [el('p', { style: { margin: 0 }, text: 'No match.' })]));
    }
    search.addEventListener('input', paintCur);
    paintCur();
    host.appendChild(curWrap);

    var codeIn = el('input', { type: 'text', placeholder: 'AUD', maxlength: '4', style: { textTransform: 'uppercase' } });
    var cnameIn = el('input', { type: 'text', placeholder: 'Australian Dollar' });
    var rateIn = el('input', { type: 'number', step: 'any', min: '0', placeholder: '0.018' });
    host.appendChild(el('div', { class: 'card card-pad', style: { marginTop: '11px' } }, [
      el('div', { class: 'grid3' }, [
        DD.field('Code', codeIn), DD.field('Name', cnameIn), DD.field('Units per ₹1', rateIn)
      ]),
      el('button', { class: 'btn sm', onclick: function () {
        var code = codeIn.value.trim().toUpperCase();
        var r = Number(rateIn.value);
        if (!code || !r || r <= 0) { DD.toast('Need a code and a positive rate', true); return; }
        db.currencies[code] = { name: cnameIn.value.trim() || code, perINR: r };
        S.save(); DD.render(); DD.toast(code + ' added');
      } }, [DD.icon('plus', 15), 'Add currency'])
    ]));

    /* -------------------------------------------------------- danger */
    host.appendChild(DD.sectionHead('The nuclear option', 'Start again'));
    host.appendChild(el('div', { class: 'card card-pad' }, [
      el('p', { class: 'small', style: { marginTop: 0 } },
        'Reset wipes what is in this browser and reloads the 36 countries from your spreadsheet. Take a JSON backup first if you are unsure.'),
      el('button', { class: 'btn danger sm', onclick: function () {
        DD.confirmBox('Reset everything?', 'Every trip, expense, photo and plan item in this browser goes. The original spreadsheet import comes back.', function () {
          try { localStorage.removeItem(S.STORE_KEY); } catch (e) { /* ignore */ }
          location.reload();
        }, 'Reset');
      } }, [DD.icon('trash', 15), 'Reset to the spreadsheet import'])
    ]));

    host.appendChild(el('p', { class: 'tiny muted', style: { marginTop: '22px', textAlign: 'center' } },
      'Duniya Darshan runs entirely in this browser. Nothing is uploaded, there is no account, and the only network calls are the optional photo lookups on Wikipedia.'));
  }

  /* Pull the repo's data file back in, over whatever is in this browser. */
  function reloadFile() {
    var file = window.DUNIYA_DATA;
    if (!file) { DD.toast('No data/trip-data.js alongside this page', true); return; }
    var mine = DD.sum(S.db().trips, function (t) { return t.expenses.length; });
    DD.confirmBox('Reload from the folder?',
      'This replaces everything in the browser with what the file holds'
      + (file.stampNote ? ' (' + file.stampNote + ')' : '') + '.'
      + (mine ? ' The ' + DD.plural(mine, 'expense') + ' logged here would go.' : ''),
      function () {
        S.replaceAll(S.deepClone(file));
        DD.render();
        DD.toast('Reloaded from the file');
      }, 'Reload');
  }

  function importJSON() {
    var input = el('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' } });
    document.body.appendChild(input);
    input.addEventListener('change', function () {
      var f = input.files && input.files[0];
      if (!f) { input.remove(); return; }
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var next = JSON.parse(reader.result);
          if (!next || !Array.isArray(next.trips)) throw new Error('not a Duniya Darshan backup');
          DD.confirmBox('Restore this backup?',
            'It replaces everything currently in this browser with ' + DD.plural(next.trips.length, 'trip') + '.',
            function () {
              S.replaceAll(next);
              DD.render();
              DD.toast('Restored');
            }, 'Restore');
        } catch (e) {
          DD.toast('That file is not a backup: ' + e.message, true);
        }
        input.remove();
      };
      reader.readAsText(f);
    });
    input.click();
  }
})();


/* ===== 99-boot.js ===== */
/* 99-boot — start the thing. */
'use strict';

(function () {
  function start() {
    DD.store.load();
    DD.buildShell();

    var hash = (location.hash || '').replace('#', '');
    DD.go(hash || 'front');

    DD.store.reconnectFile().then(function (granted) {
      paintFileState();
      if (!granted && DD.store.fileStatus() === 'pending') {
        DD.toast('Data file needs write access again — see Data');
      }
    });

    DD.on('change', paintFileState);
    DD.on('filestate', paintFileState);
    paintFileState();

    var fresh = DD.store.pendingImport();
    if (fresh) {
      setTimeout(function () { offerImport(fresh); }, 250);
    } else if (!seenBefore()) {
      markSeen();
      setTimeout(welcome, 320);
    }
  }

  var SEEN = 'duniya.seen';
  function seenBefore() {
    try { return !!localStorage.getItem(SEEN); } catch (e) { return true; }
  }
  function markSeen() {
    try { localStorage.setItem(SEEN, DD.today()); } catch (e) { /* ignore */ }
  }

  function paintFileState() {
    var node = DD.$('#file-state');
    if (!node) return;
    var s = DD.store.fileStatus();
    var txt = s === 'saved' ? 'Saved to your data file'
      : s === 'pending' ? 'Not yet written to the file'
      : s === 'none' ? 'Saved in this browser'
      : 'Saved in this browser';
    node.textContent = txt;
  }

  /* The spreadsheets have been re-imported since this browser last saved. */
  function offerImport(fresh) {
    var here = DD.store.db();
    var mine = DD.sum(here.trips, function (t) { return t.expenses.length; });
    var body = DD.el('div', {}, [
      DD.el('p', {}, [
        'The data file in this folder has been rebuilt from your spreadsheets since this browser last saved. It now holds ',
        DD.el('strong', { text: fresh.note || 'a newer import' }), '.'
      ]),
      DD.el('p', { class: 'small' },
        mine
          ? 'Loading it replaces everything here, including the ' + DD.plural(mine, 'expense') + ' you have logged. Take a backup first if those matter.'
          : 'Nothing is logged in this browser yet, so there is nothing to lose.'),
      mine ? DD.el('button', {
        class: 'btn sm', onclick: function () {
          DD.downloadFile('duniya-backup-' + DD.today() + '.json',
            JSON.stringify(DD.store.db(), null, 2), 'application/json');
          DD.toast('Backup downloaded');
        }
      }, [DD.icon('down', 14), 'Back up what I have first']) : null
    ]);

    DD.modal({
      title: 'Newer data in the folder',
      body: body,
      cancelLabel: 'Keep what I have',
      okLabel: 'Load the new file',
      ok: function (close) {
        DD.store.acceptImport();
        close();
        DD.render();
        DD.toast('Loaded — ' + (fresh.note || 'new data in'));
      }
    });

    /* Closing the dialog counts as "keep mine", and we stop asking. */
    var scrim = document.querySelector('.scrim:last-child');
    if (scrim) {
      scrim.addEventListener('click', function (e) {
        if (e.target.closest('.btn.pri')) return;
        DD.store.dismissImport();
      });
    }
  }

  function welcome() {
    var t = DD.store.trip();
    var b = DD.store.tripBudget(t);
    var body = DD.el('div', {}, [
      DD.el('p', {}, [
        'Your spreadsheet is already in here: ',
        DD.el('strong', { text: DD.plural(t.places.length, 'country', 'countries') }),
        ', ', DD.el('strong', { text: DD.money(b.total) }),
        ' budgeted, ten days apiece. Change any of it — nothing is fixed.'
      ]),
      DD.el('div', { class: 'card list', style: { margin: '14px 0' } }, [
        row('Places', 'Add or remove countries, set the days, pull in photos, keep your Drive albums.'),
        row('The map', 'Countries fill in as you plan them and deepen as you spend.'),
        row('Log', 'Type what you actually spent, in dong or baht or rupees. It converts.'),
        row('The Sheet', 'Your grid — budget, actual and the variance between them.')
      ]),
      DD.el('p', { class: 'small muted', style: { marginBottom: 0 } },
        'Everything saves in this browser as you go. Go to Data to also write it into the repo file so it commits.')
    ]);

    function row(t1, t2) {
      return DD.el('div', { class: 'list-row' }, [
        DD.el('div', { class: 'grow' }, [
          DD.el('div', { class: 't', text: t1 }),
          DD.el('div', { class: 's', style: { whiteSpace: 'normal' }, text: t2 })
        ])
      ]);
    }

    DD.modal({
      title: 'Duniya Darshan',
      body: body,
      cancelLabel: 'Have a look around',
      ok: function (close) { close(); DD.go('places'); },
      okLabel: 'Open my countries'
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

</script>
