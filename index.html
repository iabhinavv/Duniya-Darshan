    paintGal();
    host.appendChild(gal);

    var urlIn = el('input', { type: 'url', placeholder: 'https://…  paste any image link' });
    host.appendChild(el('div', { class: 'row', style: { marginBottom: '13px' } }, [
      urlIn,
      el('button', { class: 'btn', style: { flex: '0 0 auto' }, text: 'Add', onclick: function () {
        var u = urlIn.value.trim();
        if (!u) return;
        p.images.push({ url: u, credit: 'Added by you', source: '' });
        S.save(); urlIn.value = ''; paintGal();
      } })
    ]));

    var status = el('div', { class: 'muted small' });
    host.appendChild(el('div', { style: { display: 'flex', gap: '9px', alignItems: 'center', flexWrap: 'wrap' } }, [
      el('button', { class: 'btn', onclick: fetchMore }, [DD.icon('image', 15), 'Find photos of ' + (p.city || p.name)]),
      status
    ]));
    host.appendChild(el('p', { class: 'tiny muted', style: { marginTop: '10px', marginBottom: 0 } },
      DD.images.needsServer()
        ? 'Photo search needs an http:// origin — run python3 serve.py and open http://localhost:4190/. Pasting a URL works either way, and photos already saved keep showing.'
        : 'Photos come from Wikipedia and Wikimedia Commons — freely licensed, credited above. They are stored as links, so you keep them when you commit your data file.'));

    function fetchMore() {
      if (DD.images.needsServer()) {
        status.textContent = 'Opened from disk — run serve.py to search Wikipedia, or paste a URL above.';
        return;
      }
      if (!DD.images.online()) { status.textContent = 'You are offline.'; return; }
      p.noPhoto = false;
      DD.clear(status);
      status.appendChild(el('span', { class: 'spin' }));
      status.appendChild(document.createTextNode(' searching…'));
      var q = DD.images.queryFor(p);
      DD.images.search(q, 8).then(function (found) {
        var have = {};
        p.images.forEach(function (im) { have[im.url] = 1; });
        var added = 0;
        found.forEach(function (im) { if (!have[im.url]) { p.images.push(im); added++; } });
        if (added) { S.save(); paintGal(); }
        status.textContent = added ? added + ' added' : 'Nothing new found for "' + q + '"';
      }).catch(function () { status.textContent = 'Could not reach Wikimedia.'; });
    }
  }

      'Google Drive folders and files shared as "anyone with the link" show their contents inline here. Dropbox, OneDrive, iCloud and anything else appear as a link you can open.'));
  }

  /* ----- plan tab ----- */
  function planPane(t, p, host) {
    var list = el('div', { class: 'card list', style: { marginBottom: '13px' } });

/* ===== 30-sheet.js ===== */
/* 30-sheet — the spreadsheet view: places down, categories across. */
'use strict';

(function () {
  var el = DD.el, S = DD.store;
  var mode = 'budget';   /* budget | actual | variance */

  DD.register('sheet', {
    title: 'Budget vs actual',
    wide: true,
    render: render
  });

  /* The mode switch lives in the page, not the topbar: on a phone it is wide
     enough to squeeze the title out of existence. */
  function toolbar() {
    return el('div', {
      style: { display: 'flex', gap: '9px', alignItems: 'center', flexWrap: 'wrap', marginBottom: '13px' }
    }, [
      DD.segmented([['budget', 'Budget'], ['actual', 'Actual'], ['variance', 'Variance']], mode, function (v) {
        mode = v; DD.render();
      }),
      el('div', { style: { flex: '1' } }),
      el('button', { class: 'btn sm', onclick: exportCSV }, [DD.icon('down', 15), 'CSV'])
    ]);
  }

  function valueFor(t, p, catId) {
    var b = S.placeBudget(t, p);
    var a = S.actuals(t, p.id);
    if (mode === 'budget') return b.byCat[catId].base;
    if (mode === 'actual') return a.byCatMine[catId] || 0;
    return (a.byCatMine[catId] || 0) - b.byCat[catId].base;
  }

  function render(host) {
    var t = S.trip();
    var list = S.places(t);
    host.appendChild(toolbar());
    if (!list.length) {
      host.appendChild(DD.emptyState('Nothing to tabulate', 'Add a place and its budget shows up here.', 'Add a place', function () { DD.go('places'); }));
      return;
    }

    if (mode === 'budget') {
      host.appendChild(el('div', { class: 'banner info' }, [
        el('div', {}, ['Type straight into any cell to change the budget. ',
          el('strong', { text: 'Actual' }), ' and ', el('strong', { text: 'Variance' }),
          ' are worked out from what you log and cannot be typed over.'])
      ]));
    }

    var table = el('table', { class: 'grid' });

    /* head */
    var hr = el('tr', {}, [el('th', { text: t.kind === 'domestic' ? 'City' : 'Country' }), el('th', { text: 'Days' })]);
    t.categories.forEach(function (c) { hr.appendChild(el('th', { text: c.label })); });
    hr.appendChild(el('th', { text: 'Total' }));
    hr.appendChild(el('th', { text: 'Per day' }));
    if (mode === 'budget') hr.appendChild(el('th', { text: 'Running' }));
    table.appendChild(el('thead', {}, [hr]));

    /* body */
    var tb = el('tbody');
    var running = 0;
    var colTotals = {};
    t.categories.forEach(function (c) { colTotals[c.id] = 0; });
    var grand = 0, grandDays = 0;

    list.forEach(function (p) {
      var tr = el('tr', {});
      tr.appendChild(el('td', { title: p.name }, [
        p.iso2 ? el('span', { style: { marginRight: '6px' }, text: DD.flagOf(p.iso2) }) : null,
        el('button', {
          style: { border: 0, background: 'none', padding: 0, cursor: 'pointer', font: 'inherit', color: 'inherit', textDecoration: 'underline', textDecorationColor: 'var(--rule)' },
          text: p.name, onclick: function () { DD.placeEditor(t, p); }
        })
      ]));
      tr.appendChild(el('td', { class: 'n' }, String(p.days)));

      var rowTotal = 0;
      t.categories.forEach(function (c) {
        var v = valueFor(t, p, c.id);
        rowTotal += v;
        colTotals[c.id] += v;
        if (mode === 'budget') {
          var input = el('input', {
            type: 'number', class: 'cell-in', min: '0', step: '100',
            value: String(Math.round(v)),
            onchange: function () {
              p.budget[c.id] = Math.max(0, Number(input.value) || 0);
              S.save();
              DD.render();
            }
          });
          tr.appendChild(el('td', { style: { minWidth: '106px' } }, [input]));
        } else {
          var cls = 'n' + (v === 0 ? ' zero' : '') + (mode === 'variance' ? (v > 0 ? ' over' : (v < 0 ? ' under' : '')) : '');
          tr.appendChild(el('td', { class: cls }, fmt(v)));
        }
      });

      grand += rowTotal;
      grandDays += Number(p.days) || 0;
      tr.appendChild(el('td', { class: 'n' + (mode === 'variance' ? (rowTotal > 0 ? ' over' : (rowTotal < 0 ? ' under' : '')) : ''), style: { fontWeight: '650' } }, fmt(rowTotal)));
      tr.appendChild(el('td', { class: 'n muted' }, fmt(p.days ? rowTotal / p.days : 0)));
      if (mode === 'budget') {
        running += rowTotal;
        tr.appendChild(el('td', { class: 'n muted' }, DD.money(running, { compact: true })));
      }
      tb.appendChild(tr);
    });
    table.appendChild(tb);

    /* foot */
    var fr = el('tr', {}, [el('td', { text: 'All ' + list.length }), el('td', { class: 'n' }, String(grandDays))]);
    t.categories.forEach(function (c) {
      fr.appendChild(el('td', { class: 'n' + (mode === 'variance' ? (colTotals[c.id] > 0 ? ' over' : (colTotals[c.id] < 0 ? ' under' : '')) : '') }, fmt(colTotals[c.id])));
    });
    fr.appendChild(el('td', { class: 'n' }, fmt(grand)));
    fr.appendChild(el('td', { class: 'n' }, fmt(grandDays ? grand / grandDays : 0)));
    if (mode === 'budget') fr.appendChild(el('td', { class: 'n' }, DD.money(grand, { compact: true })));
    table.appendChild(el('tfoot', {}, [fr]));

    host.appendChild(el('div', { class: 'tbl-wrap' }, [table]));

    /* summary strip */
    var b = S.tripBudget(t), a = S.actuals(t);
    host.appendChild(el('div', { class: 'stats', style: { marginTop: '16px' } }, [
      DD.stat('Budget', DD.money(b.mine), DD.money(b.days ? b.mine / b.days : 0) + ' a day'),
      DD.stat('Actual', DD.money(a.mine), DD.plural(t.expenses.length, 'entry', 'entries')),
      DD.stat(a.mine > b.mine ? 'Over by' : 'Under by', DD.money(Math.abs(a.mine - b.mine)),
        DD.pct(a.mine, b.mine) + '% of budget used', a.mine > b.mine ? 'neg' : 'pos'),
      DD.stat('Places', String(list.length), DD.plural(b.days, 'day'))
    ]));

    if (t.travellerIds.length > 1) {
      host.appendChild(el('div', { class: 'banner', style: { marginTop: '14px' } }, [
        el('div', {}, ['These are ', el('strong', { text: 'your' }), ' numbers. With ',
          DD.plural(t.travellerIds.length, 'traveller'), ' the group budget is ',
          el('strong', { text: DD.money(b.group) }), ' — shared categories are split, personal ones are counted per head. See ',
          el('button', { class: 'btn xs', text: 'Split', onclick: function () { DD.go('split'); } }), '.'])
      ]));
    }
  }

  function fmt(v) {
    if (!v) return '—';
    var s = DD.groupIN(Math.abs(Math.round(v)));
    return (v < 0 ? '−' : '') + s;
  }

  function exportCSV() {
    var t = S.trip();
    var rows = [];
    rows.push([t.name + ' — ' + mode, 'all figures in INR']);
    rows.push([]);
    var head = [t.kind === 'domestic' ? 'City' : 'Country', 'City', 'Currency', 'Days'];
    t.categories.forEach(function (c) { head.push(c.label); });
    head.push('Total', 'Per day');
    rows.push(head);
    S.places(t).forEach(function (p) {
      var r = [p.name, p.city || '', p.currency, p.days];
      var tot = 0;
      t.categories.forEach(function (c) { var v = valueFor(t, p, c.id); tot += v; r.push(Math.round(v)); });
      r.push(Math.round(tot), Math.round(p.days ? tot / p.days : 0));
      rows.push(r);
    });
    DD.downloadFile(DD.slug(t.name) + '-' + mode + '-' + DD.today() + '.csv', DD.csvOf(rows), 'text/csv;charset=utf-8');
    DD.toast('CSV downloaded');
  }
})();


/* ===== 40-log.js ===== */
/* 40-log — logging real spend, and the shared expense row widget. */
'use strict';

(function () {
  var el = DD.el, S = DD.store;
  var filterPlace = '';
  var filterCat = '';

  DD.register('log', {
    title: 'Spending',
    actions: function () {
      return [el('button', { class: 'btn pri sm', onclick: function () { form(); } }, [DD.icon('plus', 15), 'New entry'])];
    },
    render: render
  });

  /* --------------------------------------------------------- the row */
  function expenseRow(t, x) {
    var p = S.placeById(t, x.placeId);
    var payer = S.personById(x.paidBy);
    var sharers = t.travellerIds.filter(function (id) { return S.shareOf(x, id, t) > 0.5; });
    var multi = t.travellerIds.length > 1;

    return el('div', {
      class: 'list-row', style: { cursor: 'pointer' },
      onclick: function () { form(x); }
    }, [
      el('span', { class: 'dot', style: { background: DD.charts.colourFor(x.category, 0) }, title: S.catLabel(t, x.category) }),
      el('div', { class: 'grow' }, [
        el('div', { class: 't' }, [
          x.note || S.catLabel(t, x.category),
          x.note ? el('span', { class: 'muted', style: { fontWeight: '400' }, text: ' · ' + S.catLabel(t, x.category) }) : null
        ]),
        el('div', { class: 's' },
          [DD.shortDate(x.date), p ? p.name : 'No place', x.currency !== 'INR' ? DD.fmtLocal(x.amount, x.currency) : null]
            .filter(Boolean).join(' · '))
      ]),
      multi ? el('div', { class: 'avatar-stack' }, sharers.slice(0, 4).map(function (id) {
        return DD.avatar(S.personById(id), true);
      })) : null,
      el('div', { style: { textAlign: 'right' } }, [
        el('div', { class: 'amt', text: DD.money(x.amountINR) }),
        multi ? el('div', { class: 'tiny muted', text: 'you ' + DD.money(S.shareOf(x, S.meId(), t)) }) : null
      ]),
      payer && multi ? el('span', { class: 'tiny muted nowrap', text: payer.id === S.meId() ? 'you paid' : payer.name + ' paid' }) : null
    ]);
  }

  /* -------------------------------------------------------- the list */
  function render(host) {
    var t = S.trip();

    if (!t.places.length) {
      host.appendChild(DD.emptyState('Add a place first',
        'Expenses attach to a country or city, so start there.', 'Go to places', function () { DD.go('places'); }));
      return;
    }

    var a = S.actuals(t), b = S.tripBudget(t);
    host.appendChild(el('div', { class: 'stats', style: { marginBottom: '15px' } }, [
      DD.stat('Logged', DD.money(a.mine), DD.plural(t.expenses.length, 'entry', 'entries')),
      DD.stat('Budget', DD.money(b.mine), DD.pct(a.mine, b.mine) + '% used'),
      DD.stat(a.mine > b.mine ? 'Over' : 'Left', DD.money(Math.abs(b.mine - a.mine)), '', a.mine > b.mine ? 'neg' : 'pos'),
      t.travellerIds.length > 1 ? DD.stat('Group total', DD.money(a.group, { compact: true }), DD.plural(t.travellerIds.length, 'traveller')) : DD.stat('Places used', String(new Set(t.expenses.map(function (x) { return x.placeId; })).size), 'of ' + t.places.length)
    ]));

    host.appendChild(el('button', { class: 'btn pri block', style: { marginBottom: '15px' }, onclick: function () { form(); } },
      [DD.icon('plus', 16), 'Log an expense']));

    if (!t.expenses.length) {
      host.appendChild(el('div', { class: 'card empty' }, [
        el('h3', { text: 'Nothing logged yet' }),
        el('p', { text: 'Every entry you add here flows into the Overview, the Sheet and the Split. Amounts can be in the local currency — they convert to ₹ automatically.' })
      ]));
      return;
    }

    /* filters */
    var placeOpts = [['', 'All places']].concat(S.places(t).map(function (p) { return [p.id, p.name]; }));
    var catOpts = [['', 'All categories']].concat(t.categories.map(function (c) { return [c.id, c.label]; }));
    host.appendChild(el('div', { class: 'row', style: { marginBottom: '13px' } }, [
      DD.selectOf(placeOpts, filterPlace, function (v) { filterPlace = v; DD.render(); }),
      DD.selectOf(catOpts, filterCat, function (v) { filterCat = v; DD.render(); })
    ]));

    var rows = t.expenses.filter(function (x) {
      return (!filterPlace || x.placeId === filterPlace) && (!filterCat || x.category === filterCat);
    }).sort(DD.by('date', 'desc'));

    if (!rows.length) {
      host.appendChild(el('div', { class: 'card empty' }, [el('p', { text: 'Nothing matches that filter.' })]));
      return;
    }

    var card = el('div', { class: 'card', style: { overflow: 'hidden' } });
    var lastDate = null;
    rows.forEach(function (x) {
      if (x.date !== lastDate) {
        lastDate = x.date;
        var dayTotal = rows.filter(function (o) { return o.date === x.date; })
          .reduce(function (s, o) { return s + S.shareOf(o, S.meId(), t); }, 0);
        card.appendChild(el('div', { class: 'day-head' }, [
          el('span', { text: DD.niceDate(x.date, true) }),
          el('span', { class: 'spacer' }),
          el('span', { class: 'num', text: DD.money(dayTotal) })
        ]));
      }
      card.appendChild(expenseRow(t, x));
    });
    host.appendChild(card);

    host.appendChild(el('div', { style: { marginTop: '14px', display: 'flex', gap: '9px', flexWrap: 'wrap' } }, [
      el('button', { class: 'btn sm', onclick: exportCSV }, [DD.icon('down', 15), 'Export these to CSV'])
    ]));
  }

  /* -------------------------------------------------------- the form */
  function form(existing) {
    var t = S.trip();
    var x = existing || null;
    var people = S.travellers(t);
    var multi = people.length > 1;

    var defaultPlace = x ? x.placeId : (filterPlace || (S.places(t)[0] || {}).id || '');
    var place = S.placeById(t, defaultPlace);

    var amountIn = el('input', { type: 'number', step: '0.01', min: '0', inputmode: 'decimal',
      placeholder: '0', value: x ? String(x.amount) : '' });
    var curSel = DD.selectOf(currencyShortlist(t, place), x ? x.currency : (place ? place.currency : 'INR'), function () { previewINR(); });
    var placeSel = DD.selectOf(S.places(t).map(function (p) { return [p.id, p.name]; }), defaultPlace, function (v) {
      var np = S.placeById(t, v);
      if (np && !x) { curSel.value = np.currency; }
      previewINR();
    });
    var catSel = DD.selectOf(t.categories.map(function (c) { return [c.id, c.label]; }), x ? x.category : 'food');
    var dateIn = el('input', { type: 'date', value: x ? x.date : DD.today() });
    var noteIn = el('input', { type: 'text', placeholder: 'Optional — what was it?', value: x ? x.note : '' });
    var conv = el('div', { class: 'tiny muted', style: { marginTop: '-8px', marginBottom: '13px', minHeight: '17px' } });

    function previewINR() {
      var code = curSel.value;
      var amt = Number(amountIn.value) || 0;
      if (!amt) { conv.textContent = ''; return; }
      if (code === 'INR') { conv.textContent = DD.money(amt); return; }
      var rate = DD.rateFor(code, S.db().currencies);
      conv.textContent = DD.num(amt, 2) + ' ' + code + '  =  ' + DD.money(amt / rate)
        + '   (1 ₹ = ' + DD.num(rate, rate < 1 ? 4 : 2) + ' ' + code + ')';
    }
    amountIn.addEventListener('input', previewINR);
    previewINR();

    var body = el('div', {});
    body.appendChild(el('div', { class: 'row' }, [
      el('label', { class: 'field', style: { flex: '2' } }, [el('span', { class: 'lbl-cap', text: 'Amount' }), amountIn]),
      el('label', { class: 'field', style: { flex: '1' } }, [el('span', { class: 'lbl-cap', text: 'Currency' }), curSel])
    ]));
    body.appendChild(conv);
    body.appendChild(el('div', { class: 'grid2' }, [
      DD.field('Category', catSel),
      DD.field(t.kind === 'domestic' ? 'City' : 'Country', placeSel)
    ]));
    body.appendChild(el('div', { class: 'grid2' }, [
      DD.field('Date', dateIn),
      DD.field('Note', noteIn)
    ]));

    /* --- split --- */
    var paidSel = null, splitMode = x ? x.splitMode : 'equal', shareState = {};
    people.forEach(function (pr) {
      shareState[pr.id] = x && x.shares && x.shares[pr.id] !== undefined
        ? Number(x.shares[pr.id]) : 1;
    });
    if (x && x.splitMode === 'mine') { /* keep */ }

    if (multi) {
      paidSel = DD.selectOf(people.map(function (pr) { return [pr.id, pr.id === S.meId() ? 'Me' : pr.name]; }),
        x ? x.paidBy : S.meId(), null);
      body.appendChild(DD.field('Paid by', paidSel));

      var whoWrap = el('div', { style: { marginBottom: '11px' } });
      var modeWrap = el('div', { style: { marginBottom: '10px' } }, [
        DD.segmented([['equal', 'Split equally'], ['exact', 'Exact amounts'], ['mine', 'Just the payer']], splitMode, function (v) {
          splitMode = v; paintWho();
        })
      ]);
      body.appendChild(el('span', { class: 'lbl-cap', text: 'Shared between' }));
      body.appendChild(modeWrap);
      body.appendChild(whoWrap);

      function paintWho() {
        DD.clear(whoWrap);
        if (splitMode === 'mine') {
          whoWrap.appendChild(el('div', { class: 'muted small', text: 'The whole amount sits with whoever paid.' }));
          return;
        }
        people.forEach(function (pr) {
          if (splitMode === 'equal') {
            var on = shareState[pr.id] > 0;
            whoWrap.appendChild(el('label', { class: 'inline-check' }, [
              el('input', { type: 'checkbox', checked: on, onchange: function () { shareState[pr.id] = this.checked ? 1 : 0; } }),
              DD.avatar(pr, true),
              el('span', { text: pr.id === S.meId() ? 'Me' : pr.name })
            ]));
          } else {
            var inp = el('input', { type: 'number', min: '0', step: '1', value: String(shareState[pr.id] || 0),
              oninput: function () { shareState[pr.id] = Number(inp.value) || 0; } });
            whoWrap.appendChild(el('div', { style: { display: 'flex', gap: '9px', alignItems: 'center', marginBottom: '8px' } }, [
              DD.avatar(pr, true),
              el('span', { style: { flex: '1' }, text: pr.id === S.meId() ? 'Me' : pr.name }),
              el('div', { style: { width: '120px' } }, [inp])
            ]));
          }
        });
        if (splitMode === 'exact') {
          whoWrap.appendChild(el('div', { class: 'tiny muted', text: 'Amounts in the currency chosen above. They should add up to the total.' }));
        }
      }
      paintWho();
    }

    var m = DD.modal({
      title: x ? 'Edit expense' : 'Log an expense',
      body: body,
      okLabel: x ? 'Save' : 'Add',
      destructive: x ? {
        label: 'Delete', run: function (close) {
          close();
          S.removeExpense(t, x.id);
          DD.render();
          DD.toast('Entry deleted');
        }
      } : null,
      ok: function (close) {
        var amt = Number(amountIn.value);
        if (!amt || amt <= 0) { amountIn.focus(); DD.toast('Enter an amount', true); return; }
        var shares = {};
        if (multi) {
          if (splitMode === 'mine') shares = {};
          else if (splitMode === 'exact') {
            var rate = DD.rateFor(curSel.value, S.db().currencies);
            people.forEach(function (pr) { shares[pr.id] = (Number(shareState[pr.id]) || 0) / rate; });
          } else {
            people.forEach(function (pr) { if (shareState[pr.id] > 0) shares[pr.id] = 1; });
            if (!Object.keys(shares).length) { DD.toast('Pick at least one person', true); return; }
          }
        }
        var rec = {
          placeId: placeSel.value, date: dateIn.value || DD.today(),
          category: catSel.value, amount: amt, currency: curSel.value,
          note: noteIn.value.trim(),
          paidBy: multi ? paidSel.value : S.meId(),
          splitMode: multi ? splitMode : 'equal',
          shares: shares
        };
        if (x) S.updateExpense(t, x.id, rec);
        else S.addExpense(t, rec);
        close();
        DD.render();
        DD.toast(x ? 'Saved' : DD.money(rec.amount / DD.rateFor(rec.currency, S.db().currencies)) + ' logged');
      }
    });

    setTimeout(function () { amountIn.focus(); }, 60);
    amountIn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); noteIn.focus(); }
    });
    return m;
  }

  /* Put the place's own currency and INR at the top; the rest follow. */
  function currencyShortlist(t, place) {
    var cur = S.db().currencies;
    var first = [];
    if (place && place.currency && place.currency !== 'INR') first.push(place.currency);
    first.push('INR');
    var rest = Object.keys(cur).filter(function (c) { return first.indexOf(c) < 0; }).sort();
    return first.concat(rest).map(function (c) { return [c, c + ' — ' + cur[c].name]; });
  }

  function exportCSV() {
    var t = S.trip();
    var rows = [['Date', 'Place', 'Category', 'Amount', 'Currency', 'INR', 'My share', 'Paid by', 'Note']];
    t.expenses.slice().sort(DD.by('date')).forEach(function (x) {
      var p = S.placeById(t, x.placeId), payer = S.personById(x.paidBy);
      rows.push([x.date, p ? p.name : '', S.catLabel(t, x.category), x.amount, x.currency,
        Math.round(x.amountINR), Math.round(S.shareOf(x, S.meId(), t)), payer ? payer.name : '', x.note || '']);
    });
    DD.downloadFile(DD.slug(t.name) + '-expenses-' + DD.today() + '.csv', DD.csvOf(rows), 'text/csv;charset=utf-8');
    DD.toast('CSV downloaded');
  }

  DD.expenseRow = expenseRow;
  DD.logForm = form;
})();


/* ===== 50-split.js ===== */
/* 50-split — fellow travellers, per-head shares, and settling up. */
'use strict';

(function () {
  var el = DD.el, S = DD.store;

  DD.register('split', {
    title: 'Travellers & split',
    actions: function () {
      return [el('button', { class: 'btn pri sm', onclick: addTraveller }, [DD.icon('plus', 15), 'Add traveller'])];
    },
    render: render
  });

  function render(host) {
    var t = S.trip();
    var people = S.travellers(t);
    var heads = people.length;

    /* ----- who is on this trip ----- */
    host.appendChild(DD.sectionHead('On this trip', el('span', { class: 'chip grey', text: DD.plural(heads, 'traveller') })));
    var card = el('div', { class: 'card list' });
    people.forEach(function (pr) {
      var isMe = pr.id === S.meId();
      card.appendChild(el('div', { class: 'list-row' }, [
        DD.avatar(pr),
        el('div', { class: 'grow' }, [
          el('div', { class: 't', text: pr.name + (isMe ? ' (you)' : '') }),
          el('div', { class: 's', text: isMe ? 'Every "my share" figure in the app is yours' : 'Shares trip costs with you' })
        ]),
        el('button', { class: 'btn xs', text: 'Rename', onclick: function () { rename(pr); } }),
        isMe ? null : el('button', {
          class: 'btn xs ghost', html: '&times;', title: 'Remove from trip',
          onclick: function () { removeFromTrip(t, pr); }
        })
      ]));
    });
    host.appendChild(card);

    var others = S.db().people.filter(function (pr) { return t.travellerIds.indexOf(pr.id) < 0; });
    if (others.length) {
      host.appendChild(el('div', { style: { marginTop: '11px' } }, [
        el('span', { class: 'lbl-cap', text: 'Add someone you have travelled with before' }),
        el('div', { class: 'chip-row' }, others.map(function (pr) {
          return el('button', { class: 'btn sm', onclick: function () {
            t.travellerIds.push(pr.id); S.save(); DD.render();
          } }, [DD.avatar(pr, true), pr.name]);
        }))
      ]));
    }

    if (heads === 1) {
      host.appendChild(el('div', { class: 'banner info', style: { marginTop: '15px' } }, [
        el('div', {}, ['Travelling alone, so every rupee is yours. Add a fellow traveller and the app starts splitting: ',
          'shared categories get divided, personal ones are counted per head, and each expense you log can be split like Splitwise.'])
      ]));
    }

    /* ----- how categories split ----- */
    host.appendChild(DD.sectionHead('How each category splits'));
    host.appendChild(el('p', { class: 'small muted', style: { marginTop: '-6px' } },
      'Shared means one bill for the group — a hotel room, a hire car. Per-person means everyone needs their own — a flight seat, a visa, a plate of food.'));

    var catCard = el('div', { class: 'card list' });
    t.categories.forEach(function (c) {
      var base = 0;
      t.places.forEach(function (p) { base += Number(p.budget[c.id]) || 0; });
      catCard.appendChild(el('div', { class: 'list-row' }, [
        el('span', { class: 'dot', style: { background: DD.charts.colourFor(c.id, t.categories.indexOf(c)) } }),
        el('div', { class: 'grow' }, [
          el('div', { class: 't', text: c.label }),
          el('div', { class: 's', text: c.shared
            ? 'One bill, split ' + heads + ' ways — group ' + DD.money(base)
            : 'Each person pays their own — group ' + DD.money(base * heads) })
        ]),
        el('span', { class: 'amt', text: DD.money(base) }),
        DD.segmented([['shared', 'Shared'], ['each', 'Per person']], c.shared ? 'shared' : 'each', function (v) {
          c.shared = (v === 'shared');
          S.save();
          DD.render();
        })
      ]));
    });
    host.appendChild(catCard);

    var b = S.tripBudget(t);
    host.appendChild(el('div', { class: 'stats', style: { marginTop: '14px' } }, [
      DD.stat('My budget', DD.money(b.mine), 'what you personally carry'),
      DD.stat('Group budget', DD.money(b.group), DD.plural(heads, 'traveller')),
      DD.stat('Group, per head', DD.money(heads ? b.group / heads : 0), 'average across everyone')
    ]));

    if (heads === 1) return;

    /* ----- settle up ----- */
    var bal = S.balances(t);
    host.appendChild(DD.sectionHead('Settle up'));

    if (!t.expenses.length) {
      host.appendChild(el('div', { class: 'card empty' }, [
        el('p', { style: { margin: 0 }, text: 'Log some expenses and the balances appear here.' })
      ]));
      return;
    }

    if (!bal.transfers.length) {
      host.appendChild(el('div', { class: 'card card-pad' }, [
        el('div', { style: { display: 'flex', gap: '10px', alignItems: 'center' } }, [
          DD.icon('check', 20), el('strong', { text: 'All square. Nobody owes anybody.' })
        ])
      ]));
    } else {
      var tw = el('div', { class: 'card card-pad' });
      bal.transfers.forEach(function (tr) {
        var from = S.personById(tr.from), to = S.personById(tr.to);
        tw.appendChild(el('div', { class: 'owes' }, [
          DD.avatar(from, true),
          el('strong', { text: from.id === S.meId() ? 'You' : from.name }),
          el('span', { class: 'muted', text: 'pay' }),
          DD.avatar(to, true),
          el('strong', { text: to.id === S.meId() ? 'you' : to.name }),
          el('span', { class: 'spacer', style: { flex: '1' } }),
          el('span', { class: 'num', style: { fontWeight: '700' }, text: DD.money(tr.amount) })
        ]));
      });
      tw.appendChild(el('p', { class: 'tiny muted', style: { margin: '8px 0 0' } },
        'The fewest transfers that clear every balance.'));
      host.appendChild(tw);
    }

    /* ----- per person ----- */
    host.appendChild(DD.sectionHead('Per person'));
    var pcard = el('div', { class: 'card card-pad' });
    bal.net.forEach(function (n) {
      var pr = S.personById(n.id);
      if (!pr) return;
      pcard.appendChild(el('div', { class: 'split-line' }, [
        DD.avatar(pr, true),
        el('span', { style: { flex: '1', fontWeight: '550' }, text: pr.id === S.meId() ? 'Me' : pr.name }),
        el('span', { class: 'tiny muted nowrap', text: 'paid ' + DD.money(n.paid, { compact: true }) }),
        el('span', { class: 'tiny muted nowrap', text: 'owes ' + DD.money(n.owed, { compact: true }) }),
        el('span', {
          class: 'num nowrap', style: { fontWeight: '700', minWidth: '92px', textAlign: 'right', color: n.net >= 0 ? 'var(--green)' : 'var(--red)' },
          text: (n.net >= 0 ? '+' : '−') + DD.money(Math.abs(n.net))
        })
      ]));
    });
    host.appendChild(pcard);
    host.appendChild(el('p', { class: 'tiny muted', style: { marginTop: '8px' } },
      'A plus means the trip owes them; a minus means they owe the trip.'));
  }

  function addTraveller() {
    var nameIn = el('input', { type: 'text', placeholder: 'Their name', autocapitalize: 'words' });
    DD.modal({
      title: 'Add a fellow traveller',
      body: el('div', {}, [
        DD.field('Name', nameIn),
        el('p', { class: 'small muted', style: { margin: 0 } },
          'They join this trip straight away. New expenses default to an equal split between everyone here; you can change the split on any single expense.')
      ]),
      okLabel: 'Add',
      ok: function (close) {
        var n = nameIn.value.trim();
        if (!n) { nameIn.focus(); return; }
        var t = S.trip();
        var pr = S.addPerson(n);
        t.travellerIds.push(pr.id);
        S.save();
        close();
        DD.render();
        DD.toast(n + ' added to ' + t.name);
      }
    });
    nameIn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); DD.$('.scrim:last-child .modal-foot .btn.pri').click(); }
    });
  }

  function rename(pr) {
    var nameIn = el('input', { type: 'text', value: pr.name });
    DD.modal({
      title: 'Rename', body: DD.field('Name', nameIn), okLabel: 'Save',
      ok: function (close) {
        pr.name = nameIn.value.trim() || pr.name;
        S.save(); close(); DD.render();
      }
    });
  }

  function removeFromTrip(t, pr) {
    var involved = t.expenses.filter(function (x) {
      return x.paidBy === pr.id || (x.shares && x.shares[pr.id]);
    }).length;
    var msg = involved
      ? pr.name + ' is on ' + DD.plural(involved, 'expense') + '. Those stay as they are, but ' + pr.name + ' drops out of new splits and the settle-up.'
      : pr.name + ' comes off this trip. Nothing else changes.';
    DD.confirmBox('Remove ' + pr.name + '?', msg, function () {
      t.travellerIds = t.travellerIds.filter(function (id) { return id !== pr.id; });
      S.save();
      DD.render();
      DD.toast(pr.name + ' removed');
    }, 'Remove');
  }
})();


/* ===== 60-itinerary.js ===== */
/* 60-itinerary — the whole trip, day by day. */
'use strict';

(function () {
  var el = DD.el, S = DD.store;

  DD.register('itinerary', {
    title: 'Itinerary',
    actions: function () {
      return [el('button', { class: 'btn sm', onclick: setDates }, [DD.icon('cal', 15), 'Trip dates'])];
    },
    render: render
  });

  function render(host) {
    var t = S.trip();
    var list = S.places(t);

    if (!list.length) {
      host.appendChild(DD.emptyState('No route yet',
        'Add places and set how many days you spend in each. The itinerary lays itself out from there.',
        'Add a place', function () { DD.go('places'); }));
      return;
    }

    var sched = S.schedule(t);
    var totalDays = DD.sum(list, function (p) { return Number(p.days) || 0; });
    var planned = DD.sum(list, function (p) { return (p.itinerary || []).length; });
    var done = DD.sum(list, function (p) { return (p.itinerary || []).filter(function (i) { return i.done; }).length; });

    host.appendChild(el('div', { class: 'stats', style: { marginBottom: '15px' } }, [
      DD.stat('Stops', String(list.length), t.kind === 'domestic' ? 'cities' : 'countries'),
      DD.stat('Days', String(totalDays), t.start ? DD.dateSpan(t.start, S.tripEnd(t)) : 'no start date set'),
      DD.stat('Planned', String(planned), done + ' ticked off'),
      DD.stat('Planned cost', DD.money(DD.sum(list, function (p) {
        return DD.sum(p.itinerary || [], function (i) { return Number(i.cost) || 0; });
      })), 'from the plan items')
    ]));

    if (!t.start) {
      host.appendChild(el('div', { class: 'banner' }, [
        el('div', {}, ['No start date, so the plan shows relative days. ',
          el('button', { class: 'btn xs', text: 'Set a start date', onclick: setDates })])
      ]));
    }

    list.forEach(function (p) {
      var s = sched[p.id] || {};
      var bud = S.placeBudget(t, p);
      var act = S.actuals(t, p.id);

      var head = el('div', { class: 'day-head', style: { borderRadius: 'var(--r-lg) var(--r-lg) 0 0' } }, [
        p.iso2 ? el('span', { text: DD.flagOf(p.iso2), style: { fontSize: '15px' } }) : null,
        el('span', { style: { fontSize: '14px' }, text: p.name }),
        el('span', { class: 'muted', style: { fontWeight: '400' },
          text: s.start ? DD.shortDate(s.start) + ' – ' + DD.shortDate(s.end) : DD.plural(p.days, 'day') }),
        el('span', { class: 'spacer' }),
        el('span', { class: 'num tiny muted', text: DD.money(act.mine, { compact: true }) + ' / ' + DD.money(bud.mine, { compact: true }) }),
        el('button', { class: 'btn xs', text: 'Edit', onclick: function () { DD.placeEditor(t, p); } })
      ]);

      var card = el('div', { class: 'card', style: { marginBottom: '13px', overflow: 'hidden' } }, [head]);
      var items = (p.itinerary || []).slice().sort(DD.by('day'));

      if (!items.length) {
        card.appendChild(el('div', { style: { padding: '15px 16px' } }, [
          el('span', { class: 'muted small', text: 'Nothing planned. ' }),
          el('button', { class: 'btn xs', text: 'Add something', onclick: function () { DD.placeEditor(t, p); } })
        ]));
      } else {
        var lastDay = null;
        items.forEach(function (it) {
          if (it.day !== lastDay) {
            lastDay = it.day;
            var date = s.start ? DD.addDays(s.start, Math.max(0, it.day - 1)) : '';
            card.appendChild(el('div', {
              style: { padding: '7px 16px', background: '#FBFCFB', borderTop: '1px solid var(--rule-2)',
                       fontSize: '12px', fontWeight: '650', color: 'var(--ink-3)', letterSpacing: '.05em', textTransform: 'uppercase' },
              text: 'Day ' + it.day + (date ? '  ·  ' + DD.niceDate(date) : '')
            }));
          }
          card.appendChild(el('div', { class: 'list-row' }, [
            el('label', { class: 'inline-check', style: { margin: 0 } }, [
              el('input', { type: 'checkbox', checked: !!it.done, onchange: function () { it.done = this.checked; S.save(); DD.render(); } })
            ]),
            el('div', { class: 'grow' }, [
              el('div', { class: 't', text: it.title, style: it.done ? { textDecoration: 'line-through', color: 'var(--ink-3)' } : {} }),
              it.note ? el('div', { class: 's', text: it.note }) : null
            ]),
            it.cost ? el('span', { class: 'amt small', text: DD.money(it.cost) }) : null
          ]));
        });
      }
      host.appendChild(card);
    });
  }

  function setDates() {
    var t = S.trip();
    var startIn = el('input', { type: 'date', value: t.start || '' });
    var noteIn = el('input', { type: 'text', value: t.note || '', placeholder: 'Optional note about the trip' });
    var preview = el('p', { class: 'small muted', style: { margin: '0' } });

    function paint() {
      var total = DD.sum(t.places, function (p) { return Number(p.days) || 0; });
      if (!startIn.value) { preview.textContent = 'Without a date the plan just counts days.'; return; }
      preview.textContent = DD.plural(total, 'day') + ' across ' + DD.plural(t.places.length, 'stop')
        + ' — ' + DD.niceDate(startIn.value, true) + ' to ' + DD.niceDate(DD.addDays(startIn.value, Math.max(0, total - 1)), true) + '.';
    }
    startIn.addEventListener('change', paint);
    paint();

    DD.modal({
      title: 'Trip dates',
      body: el('div', {}, [
        DD.field('Start date', startIn),
        DD.field('Note', noteIn),
        preview,
        el('p', { class: 'tiny muted', style: { marginTop: '10px', marginBottom: 0 } },
          'Each place runs straight after the one before it, for however many days you gave it. Reorder places on the Places screen.')
      ]),
      okLabel: 'Save',
      ok: function (close) {
        t.start = startIn.value;
        t.note = noteIn.value.trim();
        S.save(); close(); DD.render();
      }
    });
  }

  DD.tripDates = setDates;
})();

    ]);

      title: 'New trip', body: body, okLabel: 'Create',

        DD.go('places');
        DD.toast(n + ' created');
      }
    });

  function editTrip(t) {
    var nameIn = el('input', { type: 'text', value: t.name });
    var startIn = el('input', { type: 'date', value: t.start || '' });
    var noteIn = el('textarea', { placeholder: 'Anything worth remembering about this trip' });

      title: 'Edit trip',

  function duplicate(t) {
    var copy = S.deepClone(t);
    copy.id = DD.uid('trip');
    copy.name = t.name + ' (copy)';
    copy.expenses = [];
    copy.places.forEach(function (p) {

        var c = S.deepClone(i); c.id = DD.uid('it'); c.done = false; return c;
      });

    S.db().trips.push(copy);
    S.db().activeTrip = copy.id;
    S.save();
    DD.render();
    DD.toast('Copied — budget and places kept, expenses cleared');
  }

  DD.newTrip = newTrip;
})();

          ]),

      el('button', { class: 'btn sm', onclick: function () {
        var code = codeIn.value.trim().toUpperCase();
        var r = Number(rateIn.value);
        if (!code || !r || r <= 0) { DD.toast('Need a code and a positive rate', true); return; }

        S.save(); DD.render(); DD.toast(code + ' added');
      } }, [DD.icon('plus', 15), 'Add currency'])
    ]));

      el('p', { class: 'small', style: { marginTop: 0 } },
        'Reset wipes what is in this browser and reloads the 36 countries from your spreadsheet. Take a JSON backup first if you are unsure.'),
      el('button', { class: 'btn danger sm', onclick: function () {
        DD.confirmBox('Reset everything?', 'Every trip, expense, photo and plan item in this browser goes. The original spreadsheet import comes back.', function () {
          try { localStorage.removeItem(S.STORE_KEY); } catch (e) { /* ignore */ }
          location.reload();
        }, 'Reset');
      } }, [DD.icon('trash', 15), 'Reset to the spreadsheet import'])
    ]));

    host.appendChild(el('p', { class: 'tiny muted', style: { marginTop: '22px', textAlign: 'center' } },
      'Duniya Darshan runs entirely in this browser. Nothing is uploaded, there is no account, and the only network calls are the optional photo lookups on Wikipedia.'));
  }

  function importJSON() {
    var input = el('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' } });
    document.body.appendChild(input);
    input.addEventListener('change', function () {
      var f = input.files && input.files[0];
      if (!f) { input.remove(); return; }
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var next = JSON.parse(reader.result);
          if (!next || !Array.isArray(next.trips)) throw new Error('not a Duniya Darshan backup');
          DD.confirmBox('Restore this backup?',
            'It replaces everything currently in this browser with ' + DD.plural(next.trips.length, 'trip') + '.',
            function () {
              S.replaceAll(next);
              DD.render();
              DD.toast('Restored');
            }, 'Restore');
        } catch (e) {
          DD.toast('That file is not a backup: ' + e.message, true);
        }
        input.remove();
      };
      reader.readAsText(f);
    });
    input.click();
  }
})();


/* ===== 99-boot.js ===== */
/* 99-boot — start the thing. */
'use strict';

(function () {
  function start() {
    DD.store.load();
    DD.buildShell();

    var hash = (location.hash || '').replace('#', '');
    DD.go(hash || 'overview');

    DD.store.reconnectFile().then(function (granted) {
      paintFileState();
      if (!granted && DD.store.fileStatus() === 'pending') {
        DD.toast('Data file needs write access again — see Data');
      }
    });

    DD.on('change', paintFileState);
    DD.on('filestate', paintFileState);
    paintFileState();

    if (!seenBefore()) {
      markSeen();
      setTimeout(welcome, 320);
    }
  }

  var SEEN = 'duniya.seen';
  function seenBefore() {
    try { return !!localStorage.getItem(SEEN); } catch (e) { return true; }
  }
  function markSeen() {
    try { localStorage.setItem(SEEN, DD.today()); } catch (e) { /* ignore */ }
  }

  function paintFileState() {
    var node = DD.$('#rail-file-state');
    if (!node) return;
    var s = DD.store.fileStatus();
    var txt = s === 'saved' ? 'Saved to your data file'
      : s === 'pending' ? 'Not yet written to the file'
      : s === 'none' ? 'Saved in this browser'
      : 'Saved in this browser';
    node.textContent = txt;
  }

  function welcome() {
    var t = DD.store.trip();
    var b = DD.store.tripBudget(t);
    var body = DD.el('div', {}, [
      DD.el('p', {}, [
        'Your spreadsheet is already in here: ',
        DD.el('strong', { text: DD.plural(t.places.length, 'country', 'countries') }),
        ', ', DD.el('strong', { text: DD.money(b.mine) }),
        ' budgeted, ten days apiece. Change any of it — nothing is fixed.'
      ]),
      DD.el('div', { class: 'card list', style: { margin: '14px 0' } }, [
        row('Places', 'Add or remove countries, set the days, pull in photos, keep your Drive albums.'),
        row('Log', 'Type what you actually spent, in dong or baht or rupees. It converts.'),
        row('Sheet', 'Your grid — budget, actual and the variance between them.'),
        row('Split', 'Add whoever you are travelling with and settle up at the end.')
      ]),
      DD.el('p', { class: 'small muted', style: { marginBottom: 0 } },
        'Everything saves in this browser as you go. Go to Data to also write it into the repo file so it commits.')
    ]);

    function row(t1, t2) {
      return DD.el('div', { class: 'list-row' }, [
        DD.el('div', { class: 'grow' }, [
          DD.el('div', { class: 't', text: t1 }),
          DD.el('div', { class: 's', style: { whiteSpace: 'normal' }, text: t2 })
        ])
      ]);
    }

    DD.modal({
      title: 'Duniya Darshan',
      body: body,
      cancelLabel: 'Have a look around',
      ok: function (close) { close(); DD.go('places'); },
      okLabel: 'Open my countries'
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

</script>
</body>
</html>
